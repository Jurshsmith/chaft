name: Website

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      site_url:
        description: Production HTTPS URL, including an optional base path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static website
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_URL: https://website-validation.invalid
    defaults:
      run:
        working-directory: apps/website
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.14.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate static website and route-less Worker configuration
        run: pnpm validate

  artifact:
    name: Deployable website artifact
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        vars.WEBSITE_SITE_URL != ''
      )
    needs: validate
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.site_url || vars.WEBSITE_SITE_URL }}
    defaults:
      run:
        working-directory: apps/website
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.14.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require an explicit site URL
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SITE_URL}" ]]; then
            echo "::error::Set WEBSITE_SITE_URL or provide the required site_url workflow input."
            exit 1
          fi

      - name: Build production website once
        run: pnpm build

      - name: Create and verify immutable deployment artifact
        shell: bash
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/chaft-website-artifact
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/deployment-artifact-cli.mjs create \
            --source dist \
            --artifact "${ARTIFACT_DIRECTORY}" \
            --repository "${SOURCE_REPOSITORY}" \
            --commit "${SOURCE_COMMIT}" \
            --site-url "${SITE_URL}"
          node scripts/deployment-artifact-cli.mjs verify \
            --artifact "${ARTIFACT_DIRECTORY}" \
            --repository "${SOURCE_REPOSITORY}" \
            --commit "${SOURCE_COMMIT}" \
            --site-url "${SITE_URL}"

      - name: Upload immutable deployment artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chaft-website-${{ github.sha }}
          path: ${{ runner.temp }}/chaft-website-artifact/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Record artifact evidence
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          {
            echo "### Website deployment candidate"
            echo
            echo "- Source commit: \`${SOURCE_COMMIT}\`"
            echo "- Artifact ID: \`${ARTIFACT_ID}\`"
            echo "- GitHub artifact digest: \`${ARTIFACT_DIGEST}\`"
            echo "- Production deployed: **no**"
          } >> "${GITHUB_STEP_SUMMARY}"

  artifact-not-configured:
    name: Production artifact not configured
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.WEBSITE_SITE_URL == ''
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Record intentional skip
        run: |
          {
            echo "### Website deployment remains disabled"
            echo
            echo "The static website passed validation, but WEBSITE_SITE_URL is unset."
            echo "No production artifact was built and no deployment workflow can mutate Cloudflare."
          } >> "${GITHUB_STEP_SUMMARY}"
