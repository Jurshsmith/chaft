name: Promote desktop release to website

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Published desktop release tag, exactly v<semantic-version>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-desktop-release-to-website
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  prepare:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.release.prerelease == false
      }}
    name: Inspect and stage immutable release assets
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
      pull-requests: read
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      linux_x86_64_arch: ${{ steps.stage.outputs.linux_x86_64_arch }}
      linux_x86_64_signed: ${{ steps.stage.outputs.linux_x86_64_signed }}
      macos_arm64_arch: ${{ steps.stage.outputs.macos_arm64_arch }}
      macos_x86_64_arch: ${{ steps.stage.outputs.macos_x86_64_arch }}
      policy_commit: ${{ steps.release.outputs.policy_commit }}
      published_at: ${{ steps.release.outputs.published_at }}
      tag_commit: ${{ steps.release.outputs.tag_commit }}
      windows_x86_64_arch: ${{ steps.stage.outputs.windows_x86_64_arch }}
    steps:
      - name: Checkout the current default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Inspect the published GitHub Release
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Stable release tag must be exactly v<major>.<minor>.<patch>."
            exit 1
          fi

          promotion_branch="release/${RELEASE_TAG}-website-manifest"
          open_prs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f per_page=100)"
          conflicting_pr="$(jq -r \
            --arg expected "${promotion_branch}" \
            --arg base "${DEFAULT_BRANCH}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '[.[]
              | select(.head.repo.full_name == $repository)
              | select(.head.ref | startswith("release/v") and endswith("-website-manifest"))
              | select(.head.ref != $expected or .base.ref != $base)
            ][0].html_url // empty' \
            <<<"${open_prs}")"
          if [[ -n "${conflicting_pr}" ]]; then
            echo "::error::Merge or close the existing website release promotion first: ${conflicting_pr}"
            exit 1
          fi

          release_json="${RUNNER_TEMP}/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "${release_json}"
          if [[ "$(jq -r '.tag_name' "${release_json}")" != "${RELEASE_TAG}" ]]; then
            echo "::error::GitHub returned a different release tag."
            exit 1
          fi
          if [[ "$(jq -r '.draft' "${release_json}")" != "false" ]]; then
            echo "::error::Draft releases cannot be promoted."
            exit 1
          fi
          if [[ "$(jq -r '.prerelease' "${release_json}")" != "false" ]]; then
            echo "::error::Prereleases must use the dedicated canary promotion workflow."
            exit 1
          fi
          if [[ "$(jq -r '.immutable // false' "${release_json}")" != "true" ]]; then
            echo "::error::Enable GitHub immutable releases and publish all assets from a draft before promotion."
            exit 1
          fi
          gh release verify "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"

          published_at="$(jq -er '.published_at | strings | select(length > 0)' "${release_json}")"
          channel="stable"

          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          policy_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${tag_commit}" "${policy_commit}"; then
            echo "::error::Release tag commit must be an ancestor of the current protected default branch."
            exit 1
          fi
          echo "published_at=${published_at}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "tag_commit=${tag_commit}" >> "${GITHUB_OUTPUT}"
          echo "policy_commit=${policy_commit}" >> "${GITHUB_OUTPUT}"

      - name: Download and authenticate every uploaded release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/release-assets"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${RUNNER_TEMP}/release-assets"
          while IFS= read -r -d '' asset; do
            gh release verify-asset "${RELEASE_TAG}" "${asset}" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null
          done < <(find "${RUNNER_TEMP}/release-assets" -type f -print0)

      - name: Verify and isolate mandatory Qt corresponding source
        shell: bash
        env:
          VERIFIED_RELEASE_COMMIT: ${{ steps.release.outputs.tag_commit }}
        run: |
          set -euo pipefail
          assets="${RUNNER_TEMP}/release-assets"
          release_json="${RUNNER_TEMP}/release.json"
          source_assets="${RUNNER_TEMP}/qt-corresponding-source"
          bundle="Chaft-Qt-6.8.4-corresponding-source.zip"
          checksum="Chaft-Qt-6.8.4-corresponding-source.zip.sha256"
          release_source="${RUNNER_TEMP}/release-source"

          for filename in "${bundle}" "${checksum}"; do
            count="$(jq --arg filename "${filename}" \
              '[.assets[] | select(.name == $filename)] | length' \
              "${release_json}")"
            if [[ "${count}" -ne 1 ]] || \
              [[ ! -f "${assets}/${filename}" ]] || \
              [[ -L "${assets}/${filename}" ]]; then
              echo "::error::Release must contain exactly one regular ${filename} asset."
              exit 1
            fi
          done

          git worktree add --detach "${release_source}" \
            "${VERIFIED_RELEASE_COMMIT}"
          python3 tools/qt/source_bundle.py verify \
            --bundle "${assets}/${bundle}" \
            --checksum "${assets}/${checksum}" \
            --source-root "${release_source}"

          mkdir "${source_assets}"
          mv -- "${assets}/${bundle}" "${source_assets}/${bundle}"
          mv -- "${assets}/${checksum}" "${source_assets}/${checksum}"

      - name: Stage the release namespace
        id: stage
        shell: bash
        env:
          VERIFIED_RELEASE_COMMIT: ${{ steps.release.outputs.tag_commit }}
        run: |
          set -euo pipefail
          staged="${RUNNER_TEMP}/release-staged"
          receipts="${staged}/verification-receipts"
          python3 tools/desktop/stage-website-release-assets.py \
            --assets-dir "${RUNNER_TEMP}/release-assets" \
            --output-dir "${staged}"

          release_source="${RUNNER_TEMP}/release-source"
          source_assets="${RUNNER_TEMP}/qt-corresponding-source"
          for target in \
            windows-x86_64 \
            macos-x86_64 \
            macos-arm64 \
            linux-x86_64
          do
            python3 tools/desktop/verify-release-metadata.py release \
              --package-dir "${staged}/${target}-package" \
              --target "${target}" \
              --source-root "${release_source}" \
              --expected-commit "${VERIFIED_RELEASE_COMMIT}" \
              --require-clean \
              --qt-source-bundle \
                "${source_assets}/Chaft-Qt-6.8.4-corresponding-source.zip" \
              --qt-source-checksum \
                "${source_assets}/Chaft-Qt-6.8.4-corresponding-source.zip.sha256"
          done

          exact_architecture() {
            local target="$1"
            local expected="$2"
            local evidence="$3"
            local query="$4"
            local actual
            actual="$(jq -er "${query} | strings" "${evidence}")" || {
              echo "::error::${target} architecture evidence is missing."
              exit 1
            }
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error::${target} architecture must be exactly ${expected}, found ${actual}."
              exit 1
            fi
            printf '%s\n' "${actual}"
          }

          windows_x86_64_arch="$(exact_architecture \
            windows-x86_64 \
            x86_64 \
            "${receipts}/chaft-desktop-windows-x86_64-verification.json" \
            '.architecture')"
          macos_x86_64_arch="$(exact_architecture \
            macos-x86_64 \
            x86_64 \
            "${receipts}/chaft-desktop-macos-x86_64-verification.json" \
            '.architecture')"
          macos_arm64_arch="$(exact_architecture \
            macos-arm64 \
            arm64 \
            "${receipts}/chaft-desktop-macos-arm64-verification.json" \
            '.architecture')"
          linux_receipt="${receipts}/chaft-desktop-linux-x86_64-verification.json"
          if [[ -f "${linux_receipt}" ]]; then
            linux_x86_64_arch="$(exact_architecture \
              linux-x86_64 \
              x86_64 \
              "${linux_receipt}" \
              '.architecture')"
            linux_x86_64_signed="true"
          else
            linux_x86_64_arch="$(exact_architecture \
              linux-x86_64 \
              x86_64 \
              "${staged}/linux-x86_64-package/chaft-desktop-linux-x86_64-provenance.json" \
              '.packageArchitecture')"
            linux_x86_64_signed="false"
          fi

          echo "windows_x86_64_arch=${windows_x86_64_arch}" >> "${GITHUB_OUTPUT}"
          echo "macos_x86_64_arch=${macos_x86_64_arch}" >> "${GITHUB_OUTPUT}"
          echo "macos_arm64_arch=${macos_arm64_arch}" >> "${GITHUB_OUTPUT}"
          echo "linux_x86_64_arch=${linux_x86_64_arch}" >> "${GITHUB_OUTPUT}"
          echo "linux_x86_64_signed=${linux_x86_64_signed}" >> "${GITHUB_OUTPUT}"

      - name: Upload staged Windows x86-64 inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x86_64-input
          path: ${{ runner.temp }}/release-staged/windows-x86_64-package
          if-no-files-found: error
          compression-level: 0
          archive: true

      - name: Upload staged macOS Intel inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-x86_64-input
          path: ${{ runner.temp }}/release-staged/macos-x86_64-package
          if-no-files-found: error
          compression-level: 0
          archive: true

      - name: Upload staged macOS Apple Silicon inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64-input
          path: ${{ runner.temp }}/release-staged/macos-arm64-package
          if-no-files-found: error
          compression-level: 0
          archive: true

      - name: Upload staged Linux x86-64 inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x86_64-input
          path: ${{ runner.temp }}/release-staged/linux-x86_64-package
          if-no-files-found: error
          compression-level: 0
          archive: true

      - name: Upload public release receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-public-receipts
          path: ${{ runner.temp }}/release-staged/verification-receipts
          if-no-files-found: error
          archive: true

  verify_windows:
    name: Reverify Authenticode on Windows
    needs: prepare
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout trusted verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.policy_commit }}
          persist-credentials: false

      - name: Download the staged Windows x86-64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-x86_64-input
          path: ${{ runner.temp }}/windows-x86_64-package
          digest-mismatch: error

      - name: Run native Authenticode verification
        shell: bash
        env:
          TRUSTED_WINDOWS_SIGNER_THUMBPRINT: ${{ secrets.CHAFT_WINDOWS_SIGNER_THUMBPRINT }}
          VERIFIED_COMMIT: ${{ needs.prepare.outputs.tag_commit }}
        run: |
          set -euo pipefail
          if [[ -z "${TRUSTED_WINDOWS_SIGNER_THUMBPRINT}" ]]; then
            echo "::error::Configure the CHAFT_WINDOWS_SIGNER_THUMBPRINT Actions secret."
            exit 1
          fi
          mkdir "${RUNNER_TEMP}/trusted-receipts"
          python3 tools/desktop/generate-platform-verification-receipt.py \
            --target windows-x86_64 \
            --package-dir "${RUNNER_TEMP}/windows-x86_64-package" \
            --output "${RUNNER_TEMP}/trusted-receipts/chaft-desktop-windows-x86_64-verification.json" \
            --version "${RELEASE_TAG#v}" \
            --tag "${RELEASE_TAG}" \
            --commit "${VERIFIED_COMMIT}" \
            --trusted-windows-signer-thumbprint "${TRUSTED_WINDOWS_SIGNER_THUMBPRINT}"

      - name: Upload trusted Windows verification result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-windows-x86_64-receipt
          path: ${{ runner.temp }}/trusted-receipts/chaft-desktop-windows-x86_64-verification.json
          if-no-files-found: error
          archive: true

  verify_macos_x86_64:
    name: Reverify notarization and signing on macOS Intel
    needs: prepare
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - name: Checkout trusted verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.policy_commit }}
          persist-credentials: false

      - name: Download the staged macOS Intel package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-x86_64-input
          path: ${{ runner.temp }}/macos-x86_64-package
          digest-mismatch: error

      - name: Run native Intel Apple verification
        shell: bash
        env:
          TRUSTED_APPLE_TEAM_ID: ${{ secrets.CHAFT_APPLE_TEAM_ID }}
          VERIFIED_COMMIT: ${{ needs.prepare.outputs.tag_commit }}
        run: |
          set -euo pipefail
          if [[ -z "${TRUSTED_APPLE_TEAM_ID}" ]]; then
            echo "::error::Configure the CHAFT_APPLE_TEAM_ID Actions secret."
            exit 1
          fi
          if [[ "$(uname -m)" != "x86_64" ]]; then
            echo "::error::macOS Intel verification requires a native x86_64 runner."
            exit 1
          fi
          mkdir "${RUNNER_TEMP}/trusted-receipts"
          python3 tools/desktop/generate-platform-verification-receipt.py \
            --target macos-x86_64 \
            --package-dir "${RUNNER_TEMP}/macos-x86_64-package" \
            --output "${RUNNER_TEMP}/trusted-receipts/chaft-desktop-macos-x86_64-verification.json" \
            --version "${RELEASE_TAG#v}" \
            --tag "${RELEASE_TAG}" \
            --commit "${VERIFIED_COMMIT}" \
            --trusted-apple-team-id "${TRUSTED_APPLE_TEAM_ID}"

      - name: Upload trusted macOS Intel verification result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-macos-x86_64-receipt
          path: ${{ runner.temp }}/trusted-receipts/chaft-desktop-macos-x86_64-verification.json
          if-no-files-found: error
          archive: true

  verify_macos_arm64:
    name: Reverify notarization and signing on macOS Apple Silicon
    needs: prepare
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.policy_commit }}
          persist-credentials: false

      - name: Download the staged macOS Apple Silicon package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-arm64-input
          path: ${{ runner.temp }}/macos-arm64-package
          digest-mismatch: error

      - name: Run native Apple Silicon verification
        shell: bash
        env:
          TRUSTED_APPLE_TEAM_ID: ${{ secrets.CHAFT_APPLE_TEAM_ID }}
          VERIFIED_COMMIT: ${{ needs.prepare.outputs.tag_commit }}
        run: |
          set -euo pipefail
          if [[ -z "${TRUSTED_APPLE_TEAM_ID}" ]]; then
            echo "::error::Configure the CHAFT_APPLE_TEAM_ID Actions secret."
            exit 1
          fi
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "::error::macOS Apple Silicon verification requires a native arm64 runner."
            exit 1
          fi
          mkdir "${RUNNER_TEMP}/trusted-receipts"
          python3 tools/desktop/generate-platform-verification-receipt.py \
            --target macos-arm64 \
            --package-dir "${RUNNER_TEMP}/macos-arm64-package" \
            --output "${RUNNER_TEMP}/trusted-receipts/chaft-desktop-macos-arm64-verification.json" \
            --version "${RELEASE_TAG#v}" \
            --tag "${RELEASE_TAG}" \
            --commit "${VERIFIED_COMMIT}" \
            --trusted-apple-team-id "${TRUSTED_APPLE_TEAM_ID}"

      - name: Upload trusted macOS Apple Silicon verification result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-macos-arm64-receipt
          path: ${{ runner.temp }}/trusted-receipts/chaft-desktop-macos-arm64-verification.json
          if-no-files-found: error
          archive: true

  verify_linux:
    name: Reverify signed Linux x86-64 packages
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted verification code
        if: needs.prepare.outputs.linux_x86_64_signed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.policy_commit }}
          persist-credentials: false

      - name: Download the staged Linux x86-64 package
        if: needs.prepare.outputs.linux_x86_64_signed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-x86_64-input
          path: ${{ runner.temp }}/linux-x86_64-package
          digest-mismatch: error

      - name: Run native OpenPGP and ELF verification
        if: needs.prepare.outputs.linux_x86_64_signed == 'true'
        shell: bash
        env:
          TRUSTED_KEYRING_BASE64: ${{ secrets.CHAFT_LINUX_SIGNING_KEYRING_BASE64 }}
          TRUSTED_LINUX_SIGNING_FINGERPRINT: ${{ secrets.CHAFT_LINUX_SIGNING_FINGERPRINT }}
          VERIFIED_COMMIT: ${{ needs.prepare.outputs.tag_commit }}
        run: |
          set -euo pipefail
          if [[ -z "${TRUSTED_LINUX_SIGNING_FINGERPRINT}" || -z "${TRUSTED_KEYRING_BASE64}" ]]; then
            echo "::error::Configure the Linux signing fingerprint and keyring Actions secrets."
            exit 1
          fi
          mkdir "${RUNNER_TEMP}/trusted-receipts"
          keyring="${RUNNER_TEMP}/chaft-desktop-linux-signing-keyring.gpg"
          printf '%s' "${TRUSTED_KEYRING_BASE64}" | base64 --decode > "${keyring}"
          test -s "${keyring}"
          python3 tools/desktop/generate-platform-verification-receipt.py \
            --target linux-x86_64 \
            --package-dir "${RUNNER_TEMP}/linux-x86_64-package" \
            --output "${RUNNER_TEMP}/trusted-receipts/chaft-desktop-linux-x86_64-verification.json" \
            --version "${RELEASE_TAG#v}" \
            --tag "${RELEASE_TAG}" \
            --commit "${VERIFIED_COMMIT}" \
            --trusted-keyring "${keyring}" \
            --trusted-fingerprint "${TRUSTED_LINUX_SIGNING_FINGERPRINT}"

      - name: Upload trusted Linux x86-64 verification result
        if: needs.prepare.outputs.linux_x86_64_signed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-linux-x86_64-receipt
          path: ${{ runner.temp }}/trusted-receipts/chaft-desktop-linux-x86_64-verification.json
          if-no-files-found: error
          archive: true

      - name: Record checksummed-only Linux x86-64 policy
        if: needs.prepare.outputs.linux_x86_64_signed != 'true'
        run: echo "Linux x86-64 has no signing receipt; the exporter will verify package architecture directly."

  export:
    name: Export and validate the static website
    needs:
      - prepare
      - verify_windows
      - verify_macos_x86_64
      - verify_macos_arm64
      - verify_linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the current default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.policy_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download staged platform inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-input
          path: ${{ runner.temp }}/release-staged
          merge-multiple: false
          digest-mismatch: error

      - name: Download public release receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-public-receipts
          path: ${{ runner.temp }}/public-receipts
          digest-mismatch: error

      - name: Download trusted Windows receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-windows-x86_64-receipt
          path: ${{ runner.temp }}/trusted-receipts
          digest-mismatch: error

      - name: Download trusted macOS Intel receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-macos-x86_64-receipt
          path: ${{ runner.temp }}/trusted-receipts
          digest-mismatch: error

      - name: Download trusted macOS Apple Silicon receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-macos-arm64-receipt
          path: ${{ runner.temp }}/trusted-receipts
          digest-mismatch: error

      - name: Download trusted Linux x86-64 receipt
        if: needs.prepare.outputs.linux_x86_64_signed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-linux-x86_64-receipt
          path: ${{ runner.temp }}/trusted-receipts
          digest-mismatch: error

      - name: Export the verified website release manifest
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
          RELEASE_TAG_COMMIT: ${{ needs.prepare.outputs.tag_commit }}
          TRUSTED_APPLE_TEAM_ID: ${{ secrets.CHAFT_APPLE_TEAM_ID }}
          TRUSTED_LINUX_SIGNING_FINGERPRINT: ${{ secrets.CHAFT_LINUX_SIGNING_FINGERPRINT }}
          TRUSTED_WINDOWS_SIGNER_THUMBPRINT: ${{ secrets.CHAFT_WINDOWS_SIGNER_THUMBPRINT }}
          VERIFIED_LINUX_X86_64_ARCHITECTURE: ${{ needs.prepare.outputs.linux_x86_64_arch }}
          VERIFIED_MACOS_ARM64_ARCHITECTURE: ${{ needs.prepare.outputs.macos_arm64_arch }}
          VERIFIED_MACOS_X86_64_ARCHITECTURE: ${{ needs.prepare.outputs.macos_x86_64_arch }}
          VERIFIED_WINDOWS_X86_64_ARCHITECTURE: ${{ needs.prepare.outputs.windows_x86_64_arch }}
        run: |
          set -euo pipefail
          if [[ -z "${TRUSTED_WINDOWS_SIGNER_THUMBPRINT}" || -z "${TRUSTED_APPLE_TEAM_ID}" ]]; then
            echo "::error::Configure the Windows signer and Apple Team ID Actions secrets."
            exit 1
          fi

          git worktree add --detach "${RUNNER_TEMP}/release-source" "${RELEASE_TAG_COMMIT}"
          staged="${RUNNER_TEMP}/release-staged"
          public_receipts="${RUNNER_TEMP}/public-receipts"
          trusted_receipts="${RUNNER_TEMP}/trusted-receipts"
          linux_receipt_args=()
          linux_identity_args=()
          if [[ "${{ needs.prepare.outputs.linux_x86_64_signed }}" == "true" ]]; then
            if [[ -z "${TRUSTED_LINUX_SIGNING_FINGERPRINT}" ]]; then
              echo "::error::Configure the CHAFT_LINUX_SIGNING_FINGERPRINT Actions secret."
              exit 1
            fi
            linux_signing_state="signed"
            linux_receipt_args=(
              --linux-x86_64-verification-receipt "${public_receipts}/chaft-desktop-linux-x86_64-verification.json"
              --linux-x86_64-trusted-verification-receipt "${trusted_receipts}/chaft-desktop-linux-x86_64-verification.json"
            )
            linux_identity_args=(
              --trusted-linux-signing-fingerprint "${TRUSTED_LINUX_SIGNING_FINGERPRINT}"
            )
          else
            linux_signing_state="checksummed"
          fi

          python3 tools/desktop/export-website-release-manifest.py \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --source-root "${RUNNER_TEMP}/release-source" \
            --published-at "${RELEASE_PUBLISHED_AT}" \
            --channel "${RELEASE_CHANNEL}" \
            --trusted-windows-signer-thumbprint "${TRUSTED_WINDOWS_SIGNER_THUMBPRINT}" \
            --trusted-apple-team-id "${TRUSTED_APPLE_TEAM_ID}" \
            --output apps/website/src/data/release-manifest.json \
            --history-dir apps/website/src/data/release-history \
            --windows-x86_64-package-dir "${staged}/release-windows-x86_64-input" \
            --windows-x86_64-arch "${VERIFIED_WINDOWS_X86_64_ARCHITECTURE}" \
            --windows-x86_64-signing-state signed \
            --windows-x86_64-verification-receipt "${public_receipts}/chaft-desktop-windows-x86_64-verification.json" \
            --windows-x86_64-trusted-verification-receipt "${trusted_receipts}/chaft-desktop-windows-x86_64-verification.json" \
            --macos-x86_64-package-dir "${staged}/release-macos-x86_64-input" \
            --macos-x86_64-arch "${VERIFIED_MACOS_X86_64_ARCHITECTURE}" \
            --macos-x86_64-signing-state notarized \
            --macos-x86_64-verification-receipt "${public_receipts}/chaft-desktop-macos-x86_64-verification.json" \
            --macos-x86_64-trusted-verification-receipt "${trusted_receipts}/chaft-desktop-macos-x86_64-verification.json" \
            --macos-arm64-package-dir "${staged}/release-macos-arm64-input" \
            --macos-arm64-arch "${VERIFIED_MACOS_ARM64_ARCHITECTURE}" \
            --macos-arm64-signing-state notarized \
            --macos-arm64-verification-receipt "${public_receipts}/chaft-desktop-macos-arm64-verification.json" \
            --macos-arm64-trusted-verification-receipt "${trusted_receipts}/chaft-desktop-macos-arm64-verification.json" \
            --linux-x86_64-package-dir "${staged}/release-linux-x86_64-input" \
            --linux-x86_64-arch "${VERIFIED_LINUX_X86_64_ARCHITECTURE}" \
            --linux-x86_64-signing-state "${linux_signing_state}" \
            "${linux_identity_args[@]}" \
            "${linux_receipt_args[@]}"

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: apps/website
        run: pnpm install --frozen-lockfile

      - name: Validate the promoted static website
        working-directory: apps/website
        run: pnpm validate

      - name: Stage the reviewed promotion payload
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/website-release-data"
          mkdir -p "${bundle}/release-history"
          cp -- apps/website/src/data/release-manifest.json "${bundle}/release-manifest.json"
          find apps/website/src/data/release-history \
            -maxdepth 1 -type f -name '*.json' \
            -exec cp -- '{}' "${bundle}/release-history/" ';'
          (
            cd "${bundle}"
            find . -type f -name '*.json' -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload the validated promotion payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-release-data
          path: ${{ runner.temp }}/website-release-data
          if-no-files-found: error
          archive: true

  publish:
    name: Publish the website manifest branch for review
    needs:
      - prepare
      - export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      changed: ${{ steps.branch.outputs.changed }}
      head_commit: ${{ steps.branch.outputs.commit }}
    steps:
      - name: Checkout the current default branch without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.policy_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the validated promotion payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-release-data
          path: ${{ runner.temp }}/website-release-data
          digest-mismatch: error

      - name: Validate and stage the bounded data payload
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/website-release-data"
          if [[ ! -f "${bundle}/release-manifest.json" || ! -f "${bundle}/SHA256SUMS" ]]; then
            echo "::error::Promotion payload is incomplete."
            exit 1
          fi
          while IFS= read -r -d '' path; do
            relative="${path#"${bundle}/"}"
            case "${relative}" in
              release-manifest.json|SHA256SUMS|release-history/*.json)
                ;;
              *)
                echo "::error::Unexpected promotion payload path: ${relative}"
                exit 1
                ;;
            esac
          done < <(find "${bundle}" -mindepth 1 \( -type f -o -type l \) -print0)
          if find "${bundle}" -type l -print -quit | grep -q .; then
            echo "::error::Promotion payload must not contain symbolic links."
            exit 1
          fi
          (cd "${bundle}" && sha256sum --check SHA256SUMS)

          cp -- "${bundle}/release-manifest.json" \
            apps/website/src/data/release-manifest.json
          find "${bundle}/release-history" \
            -maxdepth 1 -type f -name '*.json' \
            -exec cp -- '{}' apps/website/src/data/release-history/ ';'

      - name: Publish a descriptive manifest branch
        id: branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          data_path="apps/website/src/data"
          branch="release/${RELEASE_TAG}-website-manifest"
          gh auth setup-git
          git add -- "${data_path}/release-manifest.json" "${data_path}/release-history"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

          if git diff --cached --quiet; then
            echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "The default branch already contains this immutable release manifest."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            default_commit="$(git rev-parse HEAD)"
            branch_commit="$(git rev-parse "origin/${branch}")"
            branch_parents="$(git rev-list --parents -n 1 "${branch_commit}")"
            read -r -a parent_fields <<<"${branch_parents}"
            if [[ "${#parent_fields[@]}" -ne 2 || "${parent_fields[1]}" != "${default_commit}" ]]; then
              echo "::error::Existing promotion branch is not one clean commit on the current default branch."
              exit 1
            fi
            desired_tree="$(git write-tree)"
            branch_tree="$(git show -s --format=%T "${branch_commit}")"
            if [[ "${branch_tree}" != "${desired_tree}" ]]; then
              echo "::error::Existing promotion branch contains unverified or incomplete changes."
              exit 1
            fi
          else
            git switch -c "${branch}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish Chaft ${RELEASE_TAG} website downloads"
            branch_commit="$(git rev-parse HEAD)"
            git push --set-upstream origin "${branch}"
          fi

          remote_commit="$(git ls-remote --heads origin "refs/heads/${branch}" | awk 'NR == 1 { print $1 }')"
          if [[ "${remote_commit}" != "${branch_commit}" ]]; then
            echo "::error::Promotion branch changed after its verified tree was selected."
            exit 1
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "commit=${branch_commit}" >> "${GITHUB_OUTPUT}"

      - name: Hand the exact branch to an authenticated reviewer
        if: steps.branch.outputs.changed == 'true'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_HEAD_OID: ${{ steps.branch.outputs.commit }}
          PROMOTION_BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          remote_commit="$(git ls-remote --heads origin \
            "refs/heads/${PROMOTION_BRANCH}" | awk 'NR == 1 { print $1 }')"
          if [[ "${remote_commit}" != "${EXPECTED_HEAD_OID}" ]]; then
            echo "::error::Promotion branch moved before review handoff."
            exit 1
          fi

          {
            echo "## Stable website-manifest review handoff"
            echo
            echo "- Base branch: \`${DEFAULT_BRANCH}\`"
            echo "- Verified head branch: \`${PROMOTION_BRANCH}\`"
            echo "- Verified head commit: \`${EXPECTED_HEAD_OID}\`"
            echo "- Release tag: \`${RELEASE_TAG}\`"
            echo
            echo "The workflow intentionally did not create a pull request with"
            echo "\`GITHUB_TOKEN\`. An authenticated maintainer or approved GitHub"
            echo "integration must recheck this exact remote head and open the review:"
            echo
            echo "\`gh pr create --repo ${GITHUB_REPOSITORY} --base ${DEFAULT_BRANCH} --head ${PROMOTION_BRANCH} --title \"Publish Chaft ${RELEASE_TAG} website downloads\"\`"
            echo
            echo "Compare: https://github.com/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...${PROMOTION_BRANCH}?expand=1"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Record an already-published manifest
        if: steps.branch.outputs.changed != 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERIFIED_COMMIT: ${{ steps.branch.outputs.commit }}
        run: |
          {
            echo "## Stable website manifest already current"
            echo
            echo "- Branch: \`${DEFAULT_BRANCH}\`"
            echo "- Commit: \`${VERIFIED_COMMIT}\`"
            echo "- Release tag: \`${RELEASE_TAG}\`"
            echo
            echo "No review branch or pull request is required."
          } >> "${GITHUB_STEP_SUMMARY}"
