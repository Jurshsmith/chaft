name: Build desktop release inputs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to build, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-inputs-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CHAFT_QT_VERSION: 6.8.4

jobs:
  validate:
    name: Validate tag and version
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout the current default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate requested tag with current policy
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be a stable v<major>.<minor>.<patch> tag."
            exit 1
          fi

          policy_commit="$(git rev-parse HEAD)"
          tag_commit="$(
            git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          )" || {
            echo "::error::Release tag does not resolve to a commit."
            exit 1
          }
          if ! git merge-base --is-ancestor "${tag_commit}" "${policy_commit}"; then
            echo "::error::Release tag commit must be an ancestor of the current protected default branch."
            exit 1
          fi

          release_source="${RUNNER_TEMP}/release-source"
          git worktree add --detach "${release_source}" "${tag_commit}"
          mkdir -p build
          python3 tools/desktop/release-version.py \
            --root "${release_source}" \
            --tag "$RELEASE_TAG" \
            --expected-commit "${tag_commit}" \
            --output build/release-context.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Show validated context
        run: cat build/release-context.json

      - name: Upload validated release context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-context-${{ steps.release.outputs.version }}-${{ steps.release.outputs.commit }}
          path: build/release-context.json
          if-no-files-found: error
          retention-days: 7
          archive: true

  qt_source_bundle:
    name: Build Qt corresponding-source bundle
    needs: validate
    runs-on: ubuntu-22.04
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      bundle_sha256: ${{ steps.source.outputs.bundle_sha256 }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Revalidate exact checkout
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python3 tools/desktop/release-version.py \
            --tag "$RELEASE_TAG" \
            --expected-commit HEAD

      - name: Create and verify exact Qt corresponding source
        id: source
        run: |
          set -euo pipefail
          output="build/qt-corresponding-source"
          python3 tools/qt/source_bundle.py create --output-dir "${output}"
          python3 tools/qt/source_bundle.py verify \
            --bundle "${output}/Chaft-Qt-6.8.4-corresponding-source.zip" \
            --checksum "${output}/Chaft-Qt-6.8.4-corresponding-source.zip.sha256"
          bundle_sha256="$(
            cut -d ' ' -f 1 \
              "${output}/Chaft-Qt-6.8.4-corresponding-source.zip.sha256"
          )"
          if [[ ! "${bundle_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Qt corresponding-source checksum is malformed."
            exit 1
          fi
          echo "bundle_sha256=${bundle_sha256}" >> "${GITHUB_OUTPUT}"
          expected="$(
            printf '%s\n' \
              Chaft-Qt-6.8.4-corresponding-source.zip \
              Chaft-Qt-6.8.4-corresponding-source.zip.sha256
          )"
          actual="$(find "${output}" -mindepth 1 -maxdepth 1 -type f \
            -printf '%f\n' | sort)"
          if [[ "${actual}" != "${expected}" ]] || \
            [[ "$(find "${output}" -mindepth 1 -maxdepth 1 | wc -l)" -ne 2 ]]; then
            echo "::error::Qt corresponding-source output must contain exactly the bundle and checksum."
            exit 1
          fi

      - name: Upload non-publishing Qt corresponding source
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qt-corresponding-source-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}
          path: |
            build/qt-corresponding-source/Chaft-Qt-6.8.4-corresponding-source.zip
            build/qt-corresponding-source/Chaft-Qt-6.8.4-corresponding-source.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          archive: true

  build:
    name: Build ${{ matrix.display-name }} release input
    needs:
      - validate
      - qt_source_bundle
    runs-on: ${{ matrix.runner }}
    # A cache miss compiles Qt and the release package on one runner. Cache-hit
    # runs retain their normal target; 180 minutes is the exceptional cold path.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            display-name: Windows x86-64
            runner: windows-2022
            architecture: x86_64
            package-platform: Windows
            artifact-prefix: unsigned-windows-x86_64-release-input
            # A cold offscreen QML activation can block the hosted runner's
            # event loop for longer than the portable 15-second default.
            smoke-timeout-ms: "60000"
          - target: macos-x86_64
            display-name: macOS Intel
            runner: macos-15-intel
            architecture: x86_64
            package-platform: macOS
            artifact-prefix: unsigned-macos-x86_64-release-input
            smoke-timeout-ms: ""
          - target: macos-arm64
            display-name: macOS Apple Silicon
            runner: macos-15
            architecture: arm64
            package-platform: macOS
            artifact-prefix: unsigned-macos-arm64-release-input
            smoke-timeout-ms: ""
          - target: linux-x86_64
            display-name: Linux x86-64
            runner: ubuntu-22.04
            architecture: x86_64
            package-platform: Linux
            artifact-prefix: checksummed-linux-x86_64-release-input
            smoke-timeout-ms: ""
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Revalidate exact checkout
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          python3 tools/desktop/release-version.py \
            --tag "$RELEASE_TAG" \
            --expected-commit HEAD

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: desktop
          save-if: "false"

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: tools/desktop/install-linux-package-dependencies.sh install release-package

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Set up Python for deterministic Qt tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.3"

      - name: Compute exact Qt SDK identity
        id: qt-sdk
        shell: bash
        run: |
          contract="${RUNNER_TEMP}/chaft-qt-toolchain.json"
          python3 tools/qt/build_qt.py toolchain-contract \
            --target "${{ matrix.target }}" \
            --output "${contract}"
          identity="$(
            python3 tools/qt/build_qt.py identity \
              --target "${{ matrix.target }}" \
              --toolchain-contract "${contract}"
          )"
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"

      - name: Restore main-branch Qt SDK when available
        id: qt-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/chaft-qt-sdk
          key: chaft-qt-sdk-${{ steps.qt-sdk.outputs.identity }}

      - name: Build exact Qt SDK on cache miss
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          python3 tools/qt/build_qt.py build
          --target "${{ matrix.target }}"
          --prefix "${RUNNER_TEMP}/chaft-qt-sdk"
          --work-dir "${RUNNER_TEMP}/chaft-qt-build"
          --toolchain-contract "${RUNNER_TEMP}/chaft-qt-toolchain.json"

      - name: Activate and verify exact Qt SDK
        shell: bash
        run: |
          python3 tools/qt/build_qt.py activate \
            --prefix "${RUNNER_TEMP}/chaft-qt-sdk" \
            --github-env "$GITHUB_ENV" \
            --github-path "$GITHUB_PATH"
          python3 tools/qt/build_qt.py verify \
            --target "${{ matrix.target }}" \
            --prefix "${RUNNER_TEMP}/chaft-qt-sdk" \
            --toolchain-contract "${RUNNER_TEMP}/chaft-qt-toolchain.json"

      - name: Remove transient Qt build tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "${RUNNER_TEMP:?RUNNER_TEMP must be non-empty}/chaft-qt-build"

      - name: Run platform-independent desktop contracts once
        if: runner.os == 'Linux'
        run: tools/desktop/ci-gates.sh --stage contracts Linux

      - name: Validate Linux desktop metadata
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate \
            packaging/linux/io.github.jurshsmith.chaft.desktop
          appstreamcli validate --no-net \
            packaging/linux/io.github.jurshsmith.chaft.metainfo.xml

      - name: Fetch pinned AppImage tools
        if: runner.os == 'Linux'
        run: |
          tool_dir="${RUNNER_TEMP}/chaft-appimage-tools"
          tools/desktop/fetch-appimage-tools.sh "$tool_dir"
          echo "CHAFT_LINUXDEPLOY=$tool_dir/linuxdeploy" >> "$GITHUB_ENV"
          echo "CHAFT_LINUXDEPLOY_PLUGIN_QT=$tool_dir/linuxdeploy-plugin-qt" \
            >> "$GITHUB_ENV"
          echo "CHAFT_LINUXDEPLOY_PLUGIN_APPIMAGE=$tool_dir/linuxdeploy-plugin-appimage" \
            >> "$GITHUB_ENV"

      - name: Build and verify release package
        env:
          CHAFT_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          CHAFT_RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          CHAFT_DESKTOP_SMOKE_TIMEOUT_MS: ${{ matrix.smoke-timeout-ms }}
          CHAFT_QT_SOURCE_BUNDLE_SHA256: ${{ needs.qt_source_bundle.outputs.bundle_sha256 }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          tools/desktop/ci-gates.sh \
            --stage package \
            "${{ matrix.package-platform }}"
          python3 tools/desktop/verify-release-metadata.py release \
            --target "${{ matrix.target }}" \
            --expected-commit "$EXPECTED_COMMIT" \
            --require-clean

      - name: Upload non-publishing release input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-prefix }}-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}
          path: build/desktop-release/package/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          archive: true

  clean-package-smoke:
    name: Clean ${{ matrix.display-name }} package smoke
    needs:
      - validate
      - build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            display-name: Windows x86-64
            runner: windows-2022
            architecture: x86_64
            artifact-prefix: unsigned-windows-x86_64-release-input
          - target: macos-x86_64
            display-name: macOS Intel
            runner: macos-15-intel
            architecture: x86_64
            artifact-prefix: unsigned-macos-x86_64-release-input
          - target: macos-arm64
            display-name: macOS Apple Silicon
            runner: macos-15
            architecture: arm64
            artifact-prefix: unsigned-macos-arm64-release-input
          - target: linux-x86_64
            display-name: Linux x86-64
            runner: ubuntu-22.04
            architecture: x86_64
            artifact-prefix: checksummed-linux-x86_64-release-input
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Download release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact-prefix }}-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}
          path: build/clean-package
          digest-mismatch: error

      # AppImage intentionally leaves the host GL/EGL dispatch stack unbundled
      # so it can match the user's graphics driver. GitHub's headless image
      # omits both libraries even though normal desktop installs provide them.
      - name: Install AppImage host graphics runtime
        if: runner.os == 'Linux'
        run: tools/qt/install-linux-dependencies.sh install appimage-runtime

      - name: Smoke Linux AppImage without build dependencies
        if: runner.os == 'Linux'
        run: tools/desktop/appimage-smoke.sh build/clean-package

      - name: Smoke macOS DMG without build dependencies
        if: runner.os == 'macOS'
        env:
          CHAFT_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: tools/desktop/macos-dmg-smoke.sh build/clean-package

      - name: Smoke Windows ZIP without build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tools/desktop/windows-zip-smoke.ps1 `
            -PackageDirectory build/clean-package `
            -ExpectedVersion "${{ needs.validate.outputs.version }}"

  clean-qt-source-bundle:
    name: Clean Qt corresponding-source verification
    needs:
      - validate
      - qt_source_bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Download Qt corresponding source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qt-corresponding-source-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}
          path: build/clean-qt-source
          digest-mismatch: error

      - name: Verify exact layout and checksum on a clean runner
        run: |
          set -euo pipefail
          root="build/clean-qt-source"
          expected="$(
            printf '%s\n' \
              Chaft-Qt-6.8.4-corresponding-source.zip \
              Chaft-Qt-6.8.4-corresponding-source.zip.sha256
          )"
          actual="$(find "${root}" -mindepth 1 -maxdepth 1 -type f \
            -printf '%f\n' | sort)"
          if [[ "${actual}" != "${expected}" ]] || \
            [[ "$(find "${root}" -mindepth 1 -maxdepth 1 | wc -l)" -ne 2 ]]; then
            echo "::error::Downloaded Qt source artifact has an unexpected layout."
            exit 1
          fi
          python3 tools/qt/source_bundle.py verify \
            --bundle "${root}/Chaft-Qt-6.8.4-corresponding-source.zip" \
            --checksum "${root}/Chaft-Qt-6.8.4-corresponding-source.zip.sha256"

  audit-release-inputs:
    name: Audit release input set
    needs:
      - validate
      - clean-package-smoke
      - qt_source_bundle
      - clean-qt-source-bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download validated release context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-context-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}
          path: build/release-input-audit/context
          digest-mismatch: error

      - name: Download Windows x86-64 release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-windows-x86_64-release-input-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}
          path: build/release-input-audit/windows-x86_64
          digest-mismatch: error

      - name: Download macOS Intel release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-macos-x86_64-release-input-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}
          path: build/release-input-audit/macos-x86_64
          digest-mismatch: error

      - name: Download macOS Apple Silicon release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-macos-arm64-release-input-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}
          path: build/release-input-audit/macos-arm64
          digest-mismatch: error

      - name: Download Linux x86-64 release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksummed-linux-x86_64-release-input-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}
          path: build/release-input-audit/linux-x86_64
          digest-mismatch: error

      - name: Download Qt corresponding source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qt-corresponding-source-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}
          path: build/release-input-audit/qt-source
          digest-mismatch: error

      - name: Verify context and platform metadata
        env:
          CHAFT_RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          CHAFT_QT_SOURCE_BUNDLE_SHA256: ${{ needs.qt_source_bundle.outputs.bundle_sha256 }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          EXPECTED_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 tools/desktop/release-version.py \
            --tag "$EXPECTED_TAG" \
            --expected-commit "$EXPECTED_COMMIT" \
            --output build/revalidated-release-context.json \
            > /dev/null
          python3 -c '
          import json
          from pathlib import Path
          context = json.loads(
              Path("build/release-input-audit/context/release-context.json")
              .read_text(encoding="utf-8")
          )
          revalidated = json.loads(
              Path("build/revalidated-release-context.json")
              .read_text(encoding="utf-8")
          )
          if context != revalidated:
              raise SystemExit("release context differs from the audited checkout")
          '
          for target in \
            windows-x86_64 \
            macos-x86_64 \
            macos-arm64 \
            linux-x86_64
          do
            if [[ ! -d "build/release-input-audit/$target" ]]; then
              echo "::error::Missing audited release-input bundle for $target."
              exit 1
            fi
            python3 tools/desktop/verify-release-metadata.py release \
              --package-dir "build/release-input-audit/$target" \
              --target "$target" \
              --expected-commit "$EXPECTED_COMMIT" \
              --require-clean \
              --qt-source-bundle \
                build/release-input-audit/qt-source/Chaft-Qt-6.8.4-corresponding-source.zip \
              --qt-source-checksum \
                build/release-input-audit/qt-source/Chaft-Qt-6.8.4-corresponding-source.zip.sha256
          done
          python3 tools/qt/source_bundle.py verify \
            --bundle build/release-input-audit/qt-source/Chaft-Qt-6.8.4-corresponding-source.zip \
            --checksum build/release-input-audit/qt-source/Chaft-Qt-6.8.4-corresponding-source.zip.sha256

      - name: Generate exact input inventory
        run: |
          python3 -c '
          import hashlib
          import json
          from pathlib import Path
          root = Path("build/release-input-audit")
          def file_sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()
          rows = []
          for path in sorted(item for item in root.rglob("*") if item.is_file()):
              rows.append({
                  "path": path.relative_to(root).as_posix(),
                  "sha256": file_sha256(path),
                  "sizeBytes": path.stat().st_size,
              })
          output = root / "release-input-inventory.json"
          output.write_text(
              json.dumps({"schemaVersion": 1, "files": rows}, indent=2) + "\n",
              encoding="utf-8",
          )
          '

      - name: Upload release input audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-input-audit-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.commit }}
          path: |
            build/release-input-audit/context/release-context.json
            build/release-input-audit/release-input-inventory.json
          if-no-files-found: error
          retention-days: 7
          archive: true
