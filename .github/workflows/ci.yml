          MACOS_X86_64_TOOLCHAIN: ${{ needs.qt_sdk_macos_x86_64.outputs.toolchain_fingerprint }}
          MACOS_X86_64_COMPATIBILITY: ${{ needs.qt_sdk_macos_x86_64.outputs.compatibility_fingerprint }}
          MACOS_ARM64_IDENTITY: ${{ needs.qt_sdk_macos_arm64.outputs.identity }}
          MACOS_ARM64_TOOLCHAIN: ${{ needs.qt_sdk_macos_arm64.outputs.toolchain_fingerprint }}
          MACOS_ARM64_COMPATIBILITY: ${{ needs.qt_sdk_macos_arm64.outputs.compatibility_fingerprint }}
          WINDOWS_IDENTITY: ${{ needs.qt_sdk_windows.outputs.identity }}
          WINDOWS_TOOLCHAIN: ${{ needs.qt_sdk_windows.outputs.toolchain_fingerprint }}
