          if-no-files-found: error
          compression-level: 0
          archive: true

  clean_package_smoke:
    name: Clean ${{ matrix.name }} package smoke
    needs:
      - classify
      - desktop_package
    if: >-
      always() &&
      needs.classify.outputs.package == 'true' &&
      needs.desktop_package.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            artifact-name: chaft-Linux-x86_64-desktop-release
            artifact-path: build/clean-linux-x86_64-package
          - name: macOS Intel
            os: macos-15-intel
            artifact-name: chaft-macOS-x86_64-desktop-release
            artifact-path: build/clean-macos-x86_64-package
          - name: macOS Apple Silicon
            os: macos-15
            artifact-name: chaft-macOS-arm64-desktop-release
            artifact-path: build/clean-macos-arm64-package
          - name: Windows
            os: windows-2022
            artifact-name: chaft-Windows-x86_64-desktop-release
            artifact-path: build/clean-windows-x86_64-package
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          digest-mismatch: error

      # AppImage intentionally leaves the host GL/EGL dispatch stack unbundled
      # so it can match the user's graphics driver. GitHub's headless image
      # omits both libraries even though normal desktop installs provide them.
      - name: Install AppImage host graphics runtime
        if: runner.os == 'Linux'
        run: tools/qt/install-linux-dependencies.sh install appimage-runtime

      - name: Run portable AppImage smoke
        if: runner.os == 'Linux'
        run: tools/desktop/appimage-smoke.sh "${{ matrix.artifact-path }}"

      - name: Run portable DMG smoke
        if: runner.os == 'macOS'
        run: tools/desktop/macos-dmg-smoke.sh "${{ matrix.artifact-path }}"

      - name: Verify clean macOS unsigned-canary state
        if: runner.os == 'macOS'
        run: >-
          tools/desktop/macos-unsigned-canary-smoke.sh
          "${{ matrix.artifact-path }}"

      - name: Run clean ZIP smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python tools/desktop/release-version.py --print-version
          tools/desktop/windows-zip-smoke.ps1 `
            -PackageDirectory "${{ matrix.artifact-path }}" `
            -ExpectedVersion $version

  required:
    name: Required
    if: always()
    needs:
      - classify
      - artifact_v7_producer
      - artifact_v8_consumer
      - website
      - rust_quality
      - rust_tests_ffi
      - rust_tests_runtime
      - rust_tests_workspace
      - rust_smokes
      - benchmark_compile
      - macos_local_source
      - qt_sdk_linux
      - qt_sdk_macos_x86_64
      - qt_sdk_macos_arm64
      - qt_sdk_windows
      - desktop_contracts
      - desktop
      - release_contracts
      - desktop_package
      - clean_package_smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Evaluate conditional jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci/required-check.py
