            --prefix "${RUNNER_TEMP}/chaft-qt-sdk" \
            --github-env "$GITHUB_ENV" \
            --github-path "$GITHUB_PATH"
          python3 tools/qt/build_qt.py verify \
            --target linux-x86_64 \
            --prefix "${RUNNER_TEMP}/chaft-qt-sdk" \
            --toolchain-fingerprint \
              "${{ steps.qt-sdk.outputs.toolchain_fingerprint }}"

