    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python for deterministic Qt tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.3"

      - name: Install Linux Qt SDK consumer dependencies
        run: tools/qt/install-linux-dependencies.sh install sdk-consumer

      - name: Match consumer toolchain to provisioned Qt SDK
        id: qt-sdk
        shell: bash
        env:
          PROVISIONED_IDENTITY: ${{ needs.qt_sdk_linux.outputs.identity }}
          PROVISIONED_TOOLCHAIN: ${{ needs.qt_sdk_linux.outputs.toolchain_fingerprint }}
          PROVISIONED_COMPATIBILITY: ${{ needs.qt_sdk_linux.outputs.compatibility_fingerprint }}
        run: |
          contract="${RUNNER_TEMP}/chaft-qt-consumer-toolchain.json"
          python3 tools/qt/build_qt.py toolchain-contract \
            --target linux-x86_64 \
            --output "${contract}"
          consumer_compatibility="$(
            python3 tools/ci/qt-toolchain-compatibility.py fingerprint \
              --target linux-x86_64 \
              --toolchain-contract "${contract}"
          )"
          if [[ -z "${PROVISIONED_IDENTITY}" ]]; then
            echo "::error::Provisioned Linux Qt SDK identity is missing; refusing the cache."
            exit 1
          fi
          if [[ ! "${PROVISIONED_TOOLCHAIN}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Provisioned Linux Qt SDK toolchain fingerprint is invalid; refusing the cache."
            exit 1
          fi
          if [[ ! "${PROVISIONED_COMPATIBILITY}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Provisioned Linux Qt SDK compatibility fingerprint is invalid; refusing the cache."
            exit 1
          fi
          expected_identity="$(
            python3 tools/qt/build_qt.py identity \
              --target linux-x86_64 \
              --toolchain-fingerprint "${PROVISIONED_TOOLCHAIN}"
          )"
          if [[ "${PROVISIONED_IDENTITY}" != "${expected_identity}" ]]; then
            echo "::error::Provisioned Linux Qt SDK identity is not bound to its full toolchain fingerprint; refusing the cache."
            exit 1
          fi
          if [[ "${consumer_compatibility}" != "${PROVISIONED_COMPATIBILITY}" ]]; then
            echo "::error::Linux consumer compatibility ${consumer_compatibility} does not match provisioned Qt SDK compatibility ${PROVISIONED_COMPATIBILITY}; refusing the cache."
            exit 1
          fi
          echo "identity=${PROVISIONED_IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "toolchain_fingerprint=${PROVISIONED_TOOLCHAIN}" \
            >> "$GITHUB_OUTPUT"

      - name: Restore provisioned Linux Qt SDK
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/chaft-qt-sdk
          key: chaft-qt-sdk-${{ steps.qt-sdk.outputs.identity }}
          fail-on-cache-miss: true

