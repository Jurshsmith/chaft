name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CHAFT_QT_VERSION: 6.8.3

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect non-website changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            core:
              - "**"
              - "!apps/website/**"
              - "!guides/public/**"

  rust:
    name: Rust workspace
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Compile benchmark targets
        run: cargo bench -p chaft-benchmarks --bench hot_paths --no-run --locked

      - name: Test Rust workspace
        timeout-minutes: 45
        run: cargo test --workspace --all-targets --exclude chaft-benchmarks --locked

      - name: Run local P2P smoke
        run: tools/smoke/local-p2p.sh --locked

      - name: Run visual workspace smoke
        run: tools/smoke/visual-workspace.sh --locked

      - name: Run release metadata smoke
        run: tools/desktop/release-metadata-smoke.sh

      - name: Test release promotion tools
        run: |
          python3 tools/desktop/export-website-release-manifest-test.py
          python3 tools/desktop/linux-appimage-contract-test.py
          tools/desktop/platform-verification-receipt-smoke.sh
          python3 tools/desktop/release-version-test.py
          python3 tools/desktop/stage-website-release-assets-test.py

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            qt-host: linux
            qt-arch: linux_gcc_64
            package-platform: Linux
            smoke-timeout-ms: ""
          - name: macOS
            os: macos-15-intel
            qt-host: mac
            qt-arch: clang_64
            package-platform: macOS
            smoke-timeout-ms: ""
          - name: Windows
            os: windows-latest
            qt-host: windows
            qt-arch: win64_msvc2022_64
            package-platform: Windows
            # A cold offscreen QML activation can block the hosted runner's
            # event loop for longer than the portable 15-second default.
            smoke-timeout-ms: "60000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            cmake \
            desktop-file-utils \
            ninja-build \
            patchelf

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.CHAFT_QT_VERSION }}
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Validate Linux desktop metadata
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate \
            packaging/linux/io.github.jurshsmith.chaft.desktop
          appstreamcli validate --no-net \
            packaging/linux/io.github.jurshsmith.chaft.metainfo.xml

      - name: Fetch pinned AppImage tools
        if: runner.os == 'Linux'
        run: |
          tool_dir="${RUNNER_TEMP}/chaft-appimage-tools"
          tools/desktop/fetch-appimage-tools.sh "$tool_dir"
          echo "CHAFT_LINUXDEPLOY=$tool_dir/linuxdeploy" >> "$GITHUB_ENV"
          echo "CHAFT_LINUXDEPLOY_PLUGIN_QT=$tool_dir/linuxdeploy-plugin-qt" \
            >> "$GITHUB_ENV"
          echo "CHAFT_LINUXDEPLOY_PLUGIN_APPIMAGE=$tool_dir/linuxdeploy-plugin-appimage" \
            >> "$GITHUB_ENV"

      - name: Run desktop CI gates
        env:
          CHAFT_DESKTOP_SMOKE_TIMEOUT_MS: ${{ matrix.smoke-timeout-ms }}
        shell: bash
        run: tools/desktop/ci-gates.sh "${{ matrix.package-platform }}"

      - name: Upload Linux desktop screenshot
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: chaft-linux-desktop-screenshot
          path: build/desktop-debug/smoke/*.png
          if-no-files-found: warn

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: chaft-${{ matrix.name }}-desktop-release
          path: build/desktop-release/package/*
          if-no-files-found: error
          compression-level: 0

  linux-package-smoke:
    name: Linux package on clean runner
    needs:
      - changes
      - desktop
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Linux package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chaft-Linux-desktop-release
          path: build/clean-linux-package

      # AppImage intentionally leaves the host GL/EGL dispatch stack unbundled
      # so it can match the user's graphics driver. GitHub's headless image
      # omits both libraries even though normal desktop installs provide them.
      - name: Install AppImage host graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 \
            libopengl0

      - name: Run portable AppImage smoke
        run: tools/desktop/appimage-smoke.sh build/clean-linux-package

  windows-package-smoke:
    name: Windows package on clean runner
    needs:
      - changes
      - desktop
    if: needs.changes.outputs.core == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chaft-Windows-desktop-release
          path: build/clean-windows-package

      - name: Run clean ZIP smoke
        shell: pwsh
        run: |
          $version = python tools/desktop/release-version.py --print-version
          tools/desktop/windows-zip-smoke.ps1 `
            -PackageDirectory build/clean-windows-package `
            -ExpectedVersion $version
