name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CHAFT_QT_VERSION: 6.8.4

jobs:
  classify:
    name: Change impact
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.classify.outputs.website }}
      rust: ${{ steps.classify.outputs.rust }}
      rust_test: ${{ steps.classify.outputs.rust_test }}
      rust_smoke: ${{ steps.classify.outputs.rust_smoke }}
      benchmark: ${{ steps.classify.outputs.benchmark }}
      desktop_contract: ${{ steps.classify.outputs.desktop_contract }}
      desktop: ${{ steps.classify.outputs.desktop }}
      release_contract: ${{ steps.classify.outputs.release_contract }}
      package: ${{ steps.classify.outputs.package }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - name: Checkout exact source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate CI classifier contracts
        run: |
          python3 tools/ci/classify-changes-test.py
          python3 tools/ci/qt-toolchain-compatibility-test.py
          python3 tools/ci/required-check-test.py
          python3 tools/ci/workflow-contract-test.py
          python3 tools/macos/build-local-test.py
          python3 packaging/homebrew/formula-contract-test.py
          python3 tools/qt/build_qt_test.py
          python3 tools/qt/source_bundle_test.py

      - name: Classify changed paths
        id: classify
        run: python3 tools/ci/classify-changes.py

  artifact_v7_producer:
    name: Artifact v7 producer contract
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-22.04
    outputs:
      alpha_digest: ${{ steps.upload_alpha.outputs.artifact-digest }}
      beta_digest: ${{ steps.upload_beta.outputs.artifact-digest }}
    steps:
      - name: Prepare deterministic contract payloads
        shell: bash
        run: |
          set -euo pipefail
          for label in alpha beta; do
            payload="${RUNNER_TEMP}/artifact-contract-${label}"
            mkdir -p "${payload}"
            printf 'Chaft artifact contract: %s\n' "${label}" > "${payload}/payload.txt"
            (
              cd "${payload}"
              sha256sum payload.txt > SHA256SUMS
            )
          done

      - name: Upload alpha contract artifact
        id: upload_alpha
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaft-actions-contract-alpha
          path: ${{ runner.temp }}/artifact-contract-alpha/
          if-no-files-found: error
          retention-days: 1
          archive: true

      - name: Upload beta contract artifact
        id: upload_beta
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaft-actions-contract-beta
          path: ${{ runner.temp }}/artifact-contract-beta/
          if-no-files-found: error
          retention-days: 1
          archive: true

  artifact_v8_consumer:
    name: Artifact v8 consumer contract
    needs:
      - classify
      - artifact_v7_producer
    if: >-
      always() &&
      needs.classify.outputs.full == 'true' &&
      needs.artifact_v7_producer.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Download contract artifacts with nested layout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chaft-actions-contract-*
          path: ${{ runner.temp }}/artifact-contract-download
          # v8 defaults to nested directories; the next step fails if that drifts.
          digest-mismatch: error

      - name: Verify upload digests, nested layout, and content hashes
        shell: bash
        env:
          ALPHA_ARTIFACT_DIGEST: ${{ needs.artifact_v7_producer.outputs.alpha_digest }}
          BETA_ARTIFACT_DIGEST: ${{ needs.artifact_v7_producer.outputs.beta_digest }}
        run: |
          set -euo pipefail
          for digest in "${ALPHA_ARTIFACT_DIGEST}" "${BETA_ARTIFACT_DIGEST}"; do
            if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::upload-artifact returned an invalid SHA-256 digest."
              exit 1
            fi
          done

          root="${RUNNER_TEMP}/artifact-contract-download"
          test ! -e "${root}/payload.txt"
          for label in alpha beta; do
            artifact="${root}/chaft-actions-contract-${label}"
            test -f "${artifact}/payload.txt"
            test -f "${artifact}/SHA256SUMS"
            (
              cd "${artifact}"
              sha256sum --check SHA256SUMS
            )
          done

  website:
    name: Static website
    needs: classify
    if: needs.classify.outputs.website == 'true'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_URL: https://website-validation.invalid
    defaults:
      run:
        working-directory: apps/website
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate static website and route-less Worker configuration
        run: pnpm validate

  rust_quality:
    name: Rust formatting and clippy
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Rust clippy
        run: >-
          cargo clippy --workspace --all-targets
          --exclude chaft-benchmarks --locked -- -D warnings

  rust_tests_ffi:
    name: Rust FFI tests
    needs: classify
    if: needs.classify.outputs.rust_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust
          save-if: "false"

      - name: Test Rust FFI
        run: cargo test -p chaft-ffi --locked

  rust_tests_runtime:
    name: Rust runtime tests
    needs: classify
    if: needs.classify.outputs.rust_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust
          save-if: "false"

      - name: Test Rust runtime
        run: cargo test -p chaft-runtime --locked

  rust_tests_workspace:
    name: Remaining Rust workspace tests
    needs: classify
    if: needs.classify.outputs.rust_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust
          save-if: "false"

      - name: Test remaining Rust workspace packages
        run: >-
          cargo test --workspace
          --exclude chaft-benchmarks
          --exclude chaft-ffi
          --exclude chaft-runtime
          --locked

  rust_smokes:
    name: Rust smoke tests
    needs: classify
    if: needs.classify.outputs.rust_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust
          save-if: "false"

      - name: Run local P2P smoke
        run: tools/smoke/local-p2p.sh --locked

      - name: Run visual workspace smoke
        run: tools/smoke/visual-workspace.sh --locked

  benchmark_compile:
    name: Benchmark compile
    needs: classify
    if: needs.classify.outputs.benchmark == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust
          save-if: "false"

      - name: Lint benchmark target
        run: >-
          cargo clippy -p chaft-benchmarks
          --bench hot_paths --locked -- -D warnings

      - name: Compile benchmark target
        run: cargo bench -p chaft-benchmarks --bench hot_paths --no-run --locked

  macos_local_source:
    name: macOS local source ${{ matrix.name }}
    needs: classify
    if: >-
      needs.classify.outputs.desktop == 'true' ||
      needs.classify.outputs.package == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            os: macos-15-intel
            target: macos-x86_64
            architecture: x86_64
          - name: Apple Silicon
            os: macos-15
            target: macos-arm64
            architecture: arm64
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.3"

      - name: Install current Homebrew developer dependencies
        run: brew install cmake ninja qtbase qtdeclarative qtsvg qtshadertools

      - name: Exercise complete guided local source workflow
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: >-
          tools/macos/build-local.sh
          --yes
          --no-install-deps
          --install-dir "${RUNNER_TEMP}/${{ matrix.target }}/Applications"
          --expected-commit "${GITHUB_SHA}"
          --skip-open

      - name: Verify native installed app independently
        run: >-
          tools/macos/verify-local-app.sh
          --expected-arch "${{ matrix.architecture }}"
          "${RUNNER_TEMP}/${{ matrix.target }}/Applications/Chaft.app"

      - name: Reject Homebrew Qt from official packaging
        shell: bash
        run: |
          qt_prefixes=
          for formula in qtbase qtdeclarative qtsvg qtshadertools; do
            prefix="$(brew --prefix "${formula}")"
            qt_prefixes="${prefix}${qt_prefixes:+:${qt_prefixes}}"
          done
          export QT_ROOT_DIR="$(brew --prefix qtbase)"
          export QTDIR="${QT_ROOT_DIR}"
          export CMAKE_PREFIX_PATH="${qt_prefixes}"
          export CHAFT_QT_POLICY=developer
          set +e
          output="$(tools/desktop/package.sh release 2>&1)"
          status=$?
          set -e
          printf '%s\n' "${output}"
          if [[ "${status}" -eq 0 ]]; then
            echo "::error::Official packaging accepted Homebrew developer Qt."
            exit 1
          fi
          grep -F \
            "official builds require exactly Qt 6.8.4" \
            <<<"${output}"
          if [[ -e build/desktop-release/CMakeCache.txt ]]; then
            echo "::error::Rejected developer Qt reached CMake packaging."
            exit 1
          fi

  qt_sdk_linux:
    name: Provision Qt SDK Linux
    needs: classify
    outputs:
      identity: ${{ steps.qt-sdk.outputs.identity }}
      toolchain_fingerprint: ${{ steps.qt-sdk.outputs.toolchain_fingerprint }}
      compatibility_fingerprint: ${{ steps.qt-sdk.outputs.compatibility_fingerprint }}
    if: >-
      needs.classify.outputs.desktop_contract == 'true' ||
      needs.classify.outputs.desktop == 'true' ||
      needs.classify.outputs.package == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python for deterministic Qt tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.3"

      - name: Install Qt build dependencies
        run: tools/qt/install-linux-dependencies.sh install sdk-build

      - name: Compute exact Qt SDK identity
        id: qt-sdk
        shell: bash
        run: |
          contract="${RUNNER_TEMP}/chaft-qt-toolchain.json"
          python3 tools/qt/build_qt.py toolchain-contract \
            --target linux-x86_64 \
            --output "${contract}"
          fingerprint="$(
            python3 tools/qt/build_qt.py toolchain-fingerprint \
              --target linux-x86_64 \
              --toolchain-contract "${contract}"
          )"
          compatibility_fingerprint="$(
            python3 tools/ci/qt-toolchain-compatibility.py fingerprint \
              --target linux-x86_64 \
              --toolchain-contract "${contract}"
          )"
          identity="$(
            python3 tools/qt/build_qt.py identity \
              --target linux-x86_64 \
              --toolchain-contract "${contract}"
          )"
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"
          echo "toolchain_fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"
          echo "compatibility_fingerprint=${compatibility_fingerprint}" \
            >> "$GITHUB_OUTPUT"

      - name: Restore or reserve Linux Qt SDK cache
        id: qt-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/chaft-qt-sdk
          key: chaft-qt-sdk-${{ steps.qt-sdk.outputs.identity }}

      - name: Build Linux Qt SDK from verified sources
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: >-
          python3 tools/qt/build_qt.py build
          --target linux-x86_64
          --prefix "${RUNNER_TEMP}/chaft-qt-sdk"
          --work-dir "${RUNNER_TEMP}/chaft-qt-build"
          --toolchain-contract "${RUNNER_TEMP}/chaft-qt-toolchain.json"

      - name: Verify Linux Qt SDK
        run: >-
          python3 tools/qt/build_qt.py verify
          --target linux-x86_64
          --prefix "${RUNNER_TEMP}/chaft-qt-sdk"
          --toolchain-contract "${RUNNER_TEMP}/chaft-qt-toolchain.json"

  qt_sdk_macos_x86_64:
    name: Provision Qt SDK macOS Intel
    needs: classify
    outputs:
      identity: ${{ steps.qt-sdk.outputs.identity }}
      toolchain_fingerprint: ${{ steps.qt-sdk.outputs.toolchain_fingerprint }}
      compatibility_fingerprint: ${{ steps.qt-sdk.outputs.compatibility_fingerprint }}
    if: >-
      needs.classify.outputs.desktop == 'true' ||
      needs.classify.outputs.package == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python for deterministic Qt tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.3"

      - name: Install Qt build tools
        run: brew install cmake ninja

      - name: Compute exact Qt SDK identity
        id: qt-sdk
        shell: bash
        run: |
          contract="${RUNNER_TEMP}/chaft-qt-toolchain.json"
          python3 tools/qt/build_qt.py toolchain-contract \
            --target macos-x86_64 \
            --output "${contract}"
          fingerprint="$(
            python3 tools/qt/build_qt.py toolchain-fingerprint \
              --target macos-x86_64 \
              --toolchain-contract "${contract}"
          )"
          compatibility_fingerprint="$(
            python3 tools/ci/qt-toolchain-compatibility.py fingerprint \
              --target macos-x86_64 \
              --toolchain-contract "${contract}"
          )"
          identity="$(
            python3 tools/qt/build_qt.py identity \
              --target macos-x86_64 \
              --toolchain-contract "${contract}"
          )"
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"
          echo "toolchain_fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"
          echo "compatibility_fingerprint=${compatibility_fingerprint}" \
            >> "$GITHUB_OUTPUT"

      - name: Restore or reserve macOS Qt SDK cache
        id: qt-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/chaft-qt-sdk
          key: chaft-qt-sdk-${{ steps.qt-sdk.outputs.identity }}

      - name: Build macOS Qt SDK from verified sources
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: >-
          python3 tools/qt/build_qt.py build
          --target macos-x86_64
          --prefix "${RUNNER_TEMP}/chaft-qt-sdk"
          --work-dir "${RUNNER_TEMP}/chaft-qt-build"
          --toolchain-contract "${RUNNER_TEMP}/chaft-qt-toolchain.json"

      - name: Verify macOS Qt SDK
        run: >-
          python3 tools/qt/build_qt.py verify
          --target macos-x86_64
          --prefix "${RUNNER_TEMP}/chaft-qt-sdk"
          --toolchain-contract "${RUNNER_TEMP}/chaft-qt-toolchain.json"

  qt_sdk_macos_arm64:
    name: Provision Qt SDK macOS Apple Silicon
    needs: classify
    outputs:
      identity: ${{ steps.qt-sdk.outputs.identity }}
      toolchain_fingerprint: ${{ steps.qt-sdk.outputs.toolchain_fingerprint }}
      compatibility_fingerprint: ${{ steps.qt-sdk.outputs.compatibility_fingerprint }}
    if: >-
      needs.classify.outputs.desktop == 'true' ||
      needs.classify.outputs.package == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python for deterministic Qt tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.3"

      - name: Install Qt build tools
        run: brew install cmake ninja

      - name: Compute exact Qt SDK identity
        id: qt-sdk
        shell: bash
        run: |
          contract="${RUNNER_TEMP}/chaft-qt-toolchain.json"
          python3 tools/qt/build_qt.py toolchain-contract \
            --target macos-arm64 \
            --output "${contract}"
          fingerprint="$(
            python3 tools/qt/build_qt.py toolchain-fingerprint \
              --target macos-arm64 \
              --toolchain-contract "${contract}"
          )"
          compatibility_fingerprint="$(
            python3 tools/ci/qt-toolchain-compatibility.py fingerprint \
              --target macos-arm64 \
              --toolchain-contract "${contract}"
          )"
          identity="$(
            python3 tools/qt/build_qt.py identity \
              --target macos-arm64 \
              --toolchain-contract "${contract}"
          )"
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"
          echo "toolchain_fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"
          echo "compatibility_fingerprint=${compatibility_fingerprint}" \
            >> "$GITHUB_OUTPUT"

      - name: Restore or reserve macOS Apple Silicon Qt SDK cache
        id: qt-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/chaft-qt-sdk
          key: chaft-qt-sdk-${{ steps.qt-sdk.outputs.identity }}

      - name: Build macOS Apple Silicon Qt SDK from verified sources
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: >-
          python3 tools/qt/build_qt.py build
          --target macos-arm64
          --prefix "${RUNNER_TEMP}/chaft-qt-sdk"
          --work-dir "${RUNNER_TEMP}/chaft-qt-build"
          --toolchain-contract "${RUNNER_TEMP}/chaft-qt-toolchain.json"

      - name: Verify macOS Apple Silicon Qt SDK
        run: >-
          python3 tools/qt/build_qt.py verify
          --target macos-arm64
          --prefix "${RUNNER_TEMP}/chaft-qt-sdk"
          --toolchain-contract "${RUNNER_TEMP}/chaft-qt-toolchain.json"

  qt_sdk_windows:
    name: Provision Qt SDK Windows
    needs: classify
    outputs:
      identity: ${{ steps.qt-sdk.outputs.identity }}
      toolchain_fingerprint: ${{ steps.qt-sdk.outputs.toolchain_fingerprint }}
      compatibility_fingerprint: ${{ steps.qt-sdk.outputs.compatibility_fingerprint }}
    if: >-
      needs.classify.outputs.desktop == 'true' ||
      needs.classify.outputs.package == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure MSVC 2022 x64 environment
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Set up Python for deterministic Qt tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.3"

      - name: Install Qt build tools
        run: choco install ninja --no-progress -y

      - name: Compute exact Qt SDK identity
        id: qt-sdk
        shell: bash
        run: |
          contract="${RUNNER_TEMP}/chaft-qt-toolchain.json"
          python3 tools/qt/build_qt.py toolchain-contract \
            --target windows-x86_64 \
            --output "${contract}"
          fingerprint="$(
            python3 tools/qt/build_qt.py toolchain-fingerprint \
              --target windows-x86_64 \
              --toolchain-contract "${contract}"
          )"
          compatibility_fingerprint="$(
            python3 tools/ci/qt-toolchain-compatibility.py fingerprint \
              --target windows-x86_64 \
              --toolchain-contract "${contract}"
          )"
          identity="$(
            python3 tools/qt/build_qt.py identity \
              --target windows-x86_64 \
              --toolchain-contract "${contract}"
          )"
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"
          echo "toolchain_fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"
          echo "compatibility_fingerprint=${compatibility_fingerprint}" \
            >> "$GITHUB_OUTPUT"

      - name: Restore or reserve Windows Qt SDK cache
        id: qt-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/chaft-qt-sdk
          key: chaft-qt-sdk-${{ steps.qt-sdk.outputs.identity }}

      - name: Build Windows Qt SDK from verified sources
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          python3 tools/qt/build_qt.py build
          --target windows-x86_64
          --prefix "${RUNNER_TEMP}/chaft-qt-sdk"
          --work-dir "${RUNNER_TEMP}/chaft-qt-build"
          --toolchain-contract "${RUNNER_TEMP}/chaft-qt-toolchain.json"

