name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Select focused checks or the complete suite
        required: true
        default: full
        type: choice
        options:
          - full
          - website
          - rust
          - desktop
          - local-install
          - release-contract
          - package
          - benchmarks

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.scope || 'full' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CHAFT_QT_VERSION: 6.8.4

jobs:
  classify:
    name: Change impact
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.classify.outputs.website }}
      rust: ${{ steps.classify.outputs.rust }}
      rust_test: ${{ steps.classify.outputs.rust_test }}
      rust_smoke: ${{ steps.classify.outputs.rust_smoke }}
      benchmark: ${{ steps.classify.outputs.benchmark }}
      desktop_contract: ${{ steps.classify.outputs.desktop_contract }}
      desktop: ${{ steps.classify.outputs.desktop }}
      release_contract: ${{ steps.classify.outputs.release_contract }}
      package: ${{ steps.classify.outputs.package }}
      local_install: ${{ steps.classify.outputs.local_install }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - name: Checkout exact source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate CI classifier contracts
        run: |
          python3 tools/ci/classify-changes-test.py
          python3 tools/ci/qt-toolchain-compatibility-test.py
          python3 tools/ci/required-check-test.py
          python3 tools/ci/required-platform-check-test.py
          python3 tools/ci/qt-sdk-artifact-test.py
          python3 tools/ci/workflow-contract-test.py
          python3 tools/macos/build-local-test.py
          python3 packaging/homebrew/formula-contract-test.py
          python3 tools/qt/build_qt_test.py
          python3 tools/qt/source_bundle_test.py

      - name: Classify changed paths
        id: classify
        run: python3 tools/ci/classify-changes.py

  artifact_v7_producer:
    name: Artifact v7 producer contract
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-22.04
    outputs:
      alpha_digest: ${{ steps.upload_alpha.outputs.artifact-digest }}
      beta_digest: ${{ steps.upload_beta.outputs.artifact-digest }}
    steps:
      - name: Prepare deterministic contract payloads
        shell: bash
        run: |
          set -euo pipefail
          for label in alpha beta; do
            payload="${RUNNER_TEMP}/artifact-contract-${label}"
            mkdir -p "${payload}"
            printf 'Chaft artifact contract: %s\n' "${label}" > "${payload}/payload.txt"
            (
              cd "${payload}"
              sha256sum payload.txt > SHA256SUMS
            )
          done

      - name: Upload alpha contract artifact
        id: upload_alpha
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaft-actions-contract-alpha
          path: ${{ runner.temp }}/artifact-contract-alpha/
          if-no-files-found: error
          retention-days: 1
          archive: true

      - name: Upload beta contract artifact
        id: upload_beta
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaft-actions-contract-beta
          path: ${{ runner.temp }}/artifact-contract-beta/
          if-no-files-found: error
          retention-days: 1
          archive: true

  artifact_v8_consumer:
    name: Artifact v8 consumer contract
    needs:
      - classify
      - artifact_v7_producer
    if: >-
      always() &&
      needs.classify.outputs.full == 'true' &&
      needs.artifact_v7_producer.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Download contract artifacts with nested layout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chaft-actions-contract-*
          path: ${{ runner.temp }}/artifact-contract-download
          # v8 defaults to nested directories; the next step fails if that drifts.
          digest-mismatch: error

      - name: Verify upload digests, nested layout, and content hashes
        shell: bash
        env:
          ALPHA_ARTIFACT_DIGEST: ${{ needs.artifact_v7_producer.outputs.alpha_digest }}
          BETA_ARTIFACT_DIGEST: ${{ needs.artifact_v7_producer.outputs.beta_digest }}
        run: |
          set -euo pipefail
          for digest in "${ALPHA_ARTIFACT_DIGEST}" "${BETA_ARTIFACT_DIGEST}"; do
            if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::upload-artifact returned an invalid SHA-256 digest."
              exit 1
            fi
          done

          root="${RUNNER_TEMP}/artifact-contract-download"
          test ! -e "${root}/payload.txt"
          for label in alpha beta; do
            artifact="${root}/chaft-actions-contract-${label}"
            test -f "${artifact}/payload.txt"
            test -f "${artifact}/SHA256SUMS"
            (
              cd "${artifact}"
              sha256sum --check SHA256SUMS
            )
          done

  website:
    name: Static website
    needs: classify
    if: needs.classify.outputs.website == 'true'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_URL: https://website-validation.invalid
    defaults:
      run:
        working-directory: apps/website
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate static website and route-less Worker configuration
        run: pnpm validate

  rust_quality:
    name: Rust formatting and clippy
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Rust clippy
        run: >-
          cargo clippy --workspace --all-targets
          --exclude chaft-benchmarks --locked -- -D warnings

  rust_tests_ffi:
    name: Rust FFI tests
    needs: classify
    if: needs.classify.outputs.rust_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust
          save-if: "false"

      - name: Test Rust FFI
        run: cargo test -p chaft-ffi --locked

  rust_tests_runtime:
    name: Rust runtime tests
    needs: classify
    if: needs.classify.outputs.rust_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust
          save-if: "false"

      - name: Test Rust runtime
        run: cargo test -p chaft-runtime --locked

  rust_tests_workspace:
    name: Remaining Rust workspace tests
    needs: classify
    if: needs.classify.outputs.rust_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust
          save-if: "false"

      - name: Test remaining Rust workspace packages
        run: >-
          cargo test --workspace
          --exclude chaft-benchmarks
          --exclude chaft-ffi
          --exclude chaft-runtime
          --locked

  rust_smokes:
    name: Rust smoke tests
    needs: classify
    if: needs.classify.outputs.rust_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust
          save-if: "false"

      - name: Run local P2P smoke
        run: tools/smoke/local-p2p.sh --locked

      - name: Run visual workspace smoke
        run: tools/smoke/visual-workspace.sh --locked

  benchmark_compile:
    name: Benchmark compile
    needs: classify
    if: needs.classify.outputs.benchmark == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust
          save-if: "false"

      - name: Lint benchmark target
        run: >-
          cargo clippy -p chaft-benchmarks
          --bench hot_paths --locked -- -D warnings

      - name: Compile benchmark target
        run: cargo bench -p chaft-benchmarks --bench hot_paths --no-run --locked

  macos_local_source:
    name: macOS local source ${{ matrix.name }}
    needs: classify
    if: needs.classify.outputs.local_install == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            os: macos-15-intel
            target: macos-x86_64
            architecture: x86_64
          - name: Apple Silicon
            os: macos-15
            target: macos-arm64
            architecture: arm64
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.3"

      - name: Install current Homebrew developer dependencies
        run: brew install cmake ninja qtbase qtdeclarative qtsvg qtshadertools

      - name: Exercise complete guided local source workflow
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: >-
          tools/macos/build-local.sh
          --yes
          --no-install-deps
          --install-dir "${RUNNER_TEMP}/${{ matrix.target }}/Applications"
          --expected-commit "${GITHUB_SHA}"
          --skip-open

      - name: Verify native installed app independently
        run: >-
          tools/macos/verify-local-app.sh
          --expected-arch "${{ matrix.architecture }}"
          "${RUNNER_TEMP}/${{ matrix.target }}/Applications/Chaft.app"

      - name: Reject Homebrew Qt from official packaging
        shell: bash
        run: |
          qt_prefixes=
          for formula in qtbase qtdeclarative qtsvg qtshadertools; do
            prefix="$(brew --prefix "${formula}")"
            qt_prefixes="${prefix}${qt_prefixes:+:${qt_prefixes}}"
          done
          qt_root_dir="$(brew --prefix qtbase)"
          export QT_ROOT_DIR="${qt_root_dir}"
          export QTDIR="${QT_ROOT_DIR}"
          export CMAKE_PREFIX_PATH="${qt_prefixes}"
          export CHAFT_QT_POLICY=developer
          set +e
          output="$(tools/desktop/package.sh release 2>&1)"
          status=$?
          set -e
          printf '%s\n' "${output}"
          if [[ "${status}" -eq 0 ]]; then
            echo "::error::Official packaging accepted Homebrew developer Qt."
            exit 1
          fi
          grep -F \
            "official builds require exactly Qt 6.8.4" \
            <<<"${output}"
          if [[ -e build/desktop-release/CMakeCache.txt ]]; then
            echo "::error::Rejected developer Qt reached CMake packaging."
            exit 1
          fi

  desktop_linux:
    name: Linux
    needs: classify
    if: needs.classify.outputs.desktop_contract == 'true' || needs.classify.outputs.desktop == 'true' || needs.classify.outputs.package == 'true'
    uses: ./.github/workflows/ci-desktop-platform.yml
    with:
      target: linux-x86_64
      runner: ubuntu-22.04
      display-name: Linux
      package-platform: Linux
      artifact-name: chaft-Linux-x86_64-desktop-release
      smoke-timeout-ms: ""
      run-contracts: ${{ needs.classify.outputs.desktop_contract == 'true' || needs.classify.outputs.desktop == 'true' }}
      run-desktop: ${{ needs.classify.outputs.desktop == 'true' }}
      run-package: ${{ needs.classify.outputs.package == 'true' }}

  desktop_macos_x86_64:
    name: macOS Intel
    needs: classify
    if: needs.classify.outputs.desktop == 'true' || needs.classify.outputs.package == 'true'
    uses: ./.github/workflows/ci-desktop-platform.yml
    with:
      target: macos-x86_64
      runner: macos-15-intel
      display-name: macOS Intel
      package-platform: macOS
      artifact-name: chaft-macOS-x86_64-desktop-release
      smoke-timeout-ms: ""
      run-contracts: false
      run-desktop: ${{ needs.classify.outputs.desktop == 'true' }}
      run-package: ${{ needs.classify.outputs.package == 'true' }}

  desktop_macos_arm64:
    name: macOS Apple Silicon
    needs: classify
    if: needs.classify.outputs.desktop == 'true' || needs.classify.outputs.package == 'true'
    uses: ./.github/workflows/ci-desktop-platform.yml
    with:
      target: macos-arm64
      runner: macos-15
      display-name: macOS Apple Silicon
      package-platform: macOS
      artifact-name: chaft-macOS-arm64-desktop-release
      smoke-timeout-ms: ""
      run-contracts: false
      run-desktop: ${{ needs.classify.outputs.desktop == 'true' }}
      run-package: ${{ needs.classify.outputs.package == 'true' }}

  desktop_windows:
    name: Windows
    needs: classify
    if: needs.classify.outputs.desktop == 'true' || needs.classify.outputs.package == 'true'
    uses: ./.github/workflows/ci-desktop-platform.yml
    with:
      target: windows-x86_64
      runner: windows-2022
      display-name: Windows
      package-platform: Windows
      artifact-name: chaft-Windows-x86_64-desktop-release
      smoke-timeout-ms: "60000"
      run-contracts: false
      run-desktop: ${{ needs.classify.outputs.desktop == 'true' }}
      run-package: ${{ needs.classify.outputs.package == 'true' }}

  release_contracts:
    name: Release contracts
    needs: classify
    if: >-
      needs.classify.outputs.release_contract == 'true' ||
      needs.classify.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Run release metadata smoke
        run: |
          tools/desktop/release-metadata-smoke.sh
          python3 tools/desktop/qt-release-binding-test.py

      - name: Test release promotion tools
        run: |
          python3 tools/desktop/canary-release-assets-test.py
          python3 tools/desktop/linux-release-signing-test.py
          python3 tools/desktop/export-website-release-manifest-test.py
          python3 tools/desktop/generate-unsigned-canary-receipt-test.py
          python3 tools/desktop/linux-appimage-contract-test.py
          python3 tools/desktop/macos-dmg-smoke-test.py
          python3 tools/desktop/macos-unsigned-canary-smoke-test.py
          tools/desktop/platform-verification-receipt-smoke.sh
          python3 tools/desktop/release-version-test.py
          python3 tools/desktop/stage-website-release-assets-test.py

  required:
    name: Required
    if: always()
    needs:
      - classify
      - artifact_v7_producer
      - artifact_v8_consumer
      - website
      - rust_quality
      - rust_tests_ffi
      - rust_tests_runtime
      - rust_tests_workspace
      - rust_smokes
      - benchmark_compile
      - macos_local_source
      - release_contracts
      - desktop_linux
      - desktop_macos_x86_64
      - desktop_macos_arm64
      - desktop_windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Evaluate conditional jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci/required-check.py
