name: Roll back website

# Rollback is an explicit, protected restoration of a retained successful
# deployment record. It never infers "previous" from upload order.

on:
  workflow_dispatch:
    inputs:
      target_version_id:
        description: Exact Cloudflare Worker version ID to restore
        required: true
        type: string
      expected_source_commit:
        description: Full source commit stored in the target version tag
        required: true
        type: string
      failed_version_id:
        description: Exact currently active version that the incident identified
        required: true
        type: string
      incident_id:
        description: Incident or change identifier (for example INC-2026-001)
        required: true
        type: string
      reason:
        description: Short operational reason (80 characters maximum)
        required: true
        type: string
      confirmation:
        description: Type "rollback chaft-website" exactly
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: chaft-website-production
  cancel-in-progress: false

jobs:
  rollback:
    if: >-
      ${{
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        inputs.confirmation == 'rollback chaft-website'
      }}
    name: Restore explicit Worker version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.WEBSITE_SITE_URL }}
    steps:
      - name: Checkout exact approved default-branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install exact Wrangler dependency
        working-directory: apps/website
        run: pnpm install --frozen-lockfile

      - name: Checkout the current private governance revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jurshsmith/chaft-infra
          ref: main
          path: _governance
          fetch-depth: 0
          persist-credentials: false
          ssh-key: ${{ secrets.CHAFT_INFRA_DEPLOY_KEY }}

      - name: Prove exact production governance
        env:
          EXPECTED_INFRA_COMMIT: ${{ vars.CHAFT_INFRA_COMMIT }}
          GOVERNANCE_KEY_CONFIGURED: ${{ secrets.CHAFT_INFRA_DEPLOY_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "${GOVERNANCE_KEY_CONFIGURED}" != "true" ]]; then
            echo "::error::CHAFT_INFRA_DEPLOY_KEY is not configured."
            exit 1
          fi
          node apps/website/scripts/governance-validation.mjs \
            --repository-root _governance \
            --component _governance/cloudflare/website/component.yaml \
            --expected-commit "${EXPECTED_INFRA_COMMIT}" \
            > "${RUNNER_TEMP}/governance-verification.json"

      - name: Validate request and current governance
        id: request
        shell: bash
        env:
          CHAFT_INFRA_COMMIT: ${{ vars.CHAFT_INFRA_COMMIT }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          FAILED_VERSION_ID: ${{ inputs.failed_version_id }}
          GH_TOKEN: ${{ github.token }}
          INCIDENT_ID: ${{ inputs.incident_id }}
          REASON: ${{ inputs.reason }}
          SITE_URL: ${{ vars.WEBSITE_SITE_URL }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${TARGET_VERSION_ID}" =~ ^[a-f0-9-]{32,64}$ ]]; then
            echo "::error::target_version_id is malformed."
            exit 1
          fi
          if [[ ! "${EXPECTED_SOURCE_COMMIT}" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]]; then
            echo "::error::expected_source_commit is malformed."
            exit 1
          fi
          if [[ ! "${FAILED_VERSION_ID}" =~ ^[a-f0-9-]{32,64}$ ]]; then
            echo "::error::failed_version_id is malformed."
            exit 1
          fi
          if [[ ! "${INCIDENT_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{2,79}$ ]]; then
            echo "::error::incident_id must be 3 to 80 safe identifier characters."
            exit 1
          fi
          if [[ -z "${REASON}" || ${#REASON} -gt 80 || "${REASON}" == *$'\n'* || "${REASON}" == *$'\r'* ]]; then
            echo "::error::reason must be one line containing 1 to 80 characters."
            exit 1
          fi
          if [[ ! "${CHAFT_INFRA_COMMIT}" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]]; then
            echo "::error::CHAFT_INFRA_COMMIT must name the reviewed enabling commit."
            exit 1
          fi
          if [[ -z "${SITE_URL}" ]]; then
            echo "::error::WEBSITE_SITE_URL is not configured."
            exit 1
          fi
          current_main="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" \
            --jq '.sha')"
          if [[ "${current_main}" != "${WORKFLOW_SHA}" ]]; then
            echo "::error::Run rollback only from the current default-branch revision."
            exit 1
          fi
          echo "rollback_message=${INCIDENT_ID}: restore ${EXPECTED_SOURCE_COMMIT:0:12} from failed ${FAILED_VERSION_ID}: ${REASON}" >> "${GITHUB_OUTPUT}"

      - name: Resolve retained successful deployment record
        id: evidence
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_name="chaft-website-deployment-${EXPECTED_SOURCE_COMMIT}"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${expected_name}&per_page=100" \
            > "${RUNNER_TEMP}/deployment-record-artifacts.json"
          node - <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/deployment-record-artifacts.json`, "utf8"),
          );
          const expectedName = `chaft-website-deployment-${process.env.EXPECTED_SOURCE_COMMIT}`;
          const artifacts = payload.artifacts?.filter(
            (artifact) => artifact.name === expectedName && artifact.expired === false,
          );
          if (!Array.isArray(artifacts) || artifacts.length !== 1) {
            throw new Error(`expected one retained deployment record, received ${artifacts?.length}`);
          }
          const artifact = artifacts[0];
          if (
            !Number.isSafeInteger(artifact.id) ||
            !Number.isSafeInteger(artifact.workflow_run?.id) ||
            !/^sha256:[a-f0-9]{64}$/.test(artifact.digest)
          ) {
            throw new Error("retained deployment record identity is malformed");
          }
          for (const [name, value] of [
            ["artifact_id", artifact.id],
            ["artifact_name", artifact.name],
            ["artifact_digest", artifact.digest],
            ["run_id", artifact.workflow_run.id],
          ]) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }
          NODE

      - name: Download retained successful deployment record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: ${{ runner.temp }}/target-deployment-record
          run-id: ${{ steps.evidence.outputs.run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error

      - name: Validate retained rollback target evidence
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          GOVERNANCE_COMMIT: ${{ vars.CHAFT_INFRA_COMMIT }}
          SITE_URL: ${{ vars.WEBSITE_SITE_URL }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const record = JSON.parse(
            fs.readFileSync(
              `${process.env.RUNNER_TEMP}/target-deployment-record/deployment-record.json`,
              "utf8",
            ),
          );
          if (
            record.schemaVersion !== 1 ||
            record.artifactKind !== "chaft-website-deployment-record" ||
            record.result !== "passed" ||
            record.source?.repository !== process.env.GITHUB_REPOSITORY ||
            record.source?.commit !== process.env.EXPECTED_SOURCE_COMMIT ||
            record.cloudflare?.worker !== "chaft-website" ||
            record.cloudflare?.siteUrl !== process.env.SITE_URL ||
            record.cloudflare?.newVersionId !== process.env.TARGET_VERSION_ID ||
            !/^sha256:[a-f0-9]{64}$/.test(record.artifact?.digest) ||
            !/^[a-f0-9]{64}$/.test(record.artifact?.manifestSha256) ||
            record.verification?.result !== "passed"
          ) {
            throw new Error("retained deployment record does not authorize this rollback target");
          }
          NODE

      - name: Inspect target and current deployment with read-only token
        id: inspect
        shell: bash
        working-directory: apps/website
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          FAILED_VERSION_ID: ${{ inputs.failed_version_id }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
        run: |
          set -euo pipefail
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is malformed."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_READ_API_TOKEN is not configured."
            exit 1
          fi
          pnpm exec wrangler versions view "${TARGET_VERSION_ID}" \
            --config wrangler.jsonc \
            --json > "${RUNNER_TEMP}/target-version.json"
          pnpm exec wrangler deployments status \
            --config wrangler.jsonc \
            --json > "${RUNNER_TEMP}/deployment-before.json"
          curl --fail --silent --show-error \
            --connect-timeout 5 \
            --max-time 20 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?service=chaft-website" \
            --output "${RUNNER_TEMP}/domains-before-response.json"
          node - <<'NODE'
          const fs = require("node:fs");
          const target = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/target-version.json`, "utf8"),
          );
          const deployment = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/deployment-before.json`, "utf8"),
          );
          if (target.id !== process.env.TARGET_VERSION_ID) {
            throw new Error("Cloudflare returned a different target version");
          }
          if (target.annotations?.["workers/tag"] !== process.env.EXPECTED_SOURCE_COMMIT) {
            throw new Error("target version tag does not match expected_source_commit");
          }
          if (target.resources?.bindings?.some((binding) => binding.type === "secret_text")) {
            throw new Error("asset-only rollback target unexpectedly contains secrets");
          }
          const active = deployment.versions?.filter(
            (version) => version.percentage === 100,
          );
          if (
            typeof deployment.id !== "string" ||
            !/^[a-f0-9-]{32,64}$/i.test(deployment.id) ||
            active?.length !== 1 ||
            typeof active[0].version_id !== "string" ||
            !/^[a-f0-9-]{32,64}$/i.test(active[0].version_id)
          ) {
            throw new Error("current deployment is not one version at 100 percent");
          }
          if (active[0].version_id !== process.env.FAILED_VERSION_ID) {
            throw new Error("failed_version_id is no longer the active production version");
          }
          if (active[0].version_id === process.env.TARGET_VERSION_ID) {
            throw new Error("target version is already serving 100 percent of traffic");
          }
          const domainsPayload = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/domains-before-response.json`, "utf8"),
          );
          if (domainsPayload.success !== true || !Array.isArray(domainsPayload.result)) {
            throw new Error("Cloudflare Custom Domain query failed");
          }
          const domains = domainsPayload.result
            .filter((domain) => domain.service === "chaft-website")
            .map(({ hostname, service, zone_name: zoneName }) => ({ hostname, service, zoneName }))
            .sort((left, right) => left.hostname.localeCompare(right.hostname));
          const expectedDomains = ["chaft.ai", "www.chaft.ai"];
          if (
            domains.length !== expectedDomains.length ||
            domains.some(
              (domain, index) =>
                domain.hostname !== expectedDomains[index] ||
                domain.service !== "chaft-website" ||
                domain.zoneName !== "chaft.ai",
            )
          ) {
            throw new Error(`unexpected Custom Domains: ${JSON.stringify(domains)}`);
          }
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/domains-before.json`,
            `${JSON.stringify(domains, null, 2)}\n`,
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `previous_deployment_id=${deployment.id}\nprevious_version_id=${active[0].version_id}\n`,
          );
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/previous-version-id`,
            `${active[0].version_id}\n`,
          );
          NODE
          IFS= read -r previous_version_id < "${RUNNER_TEMP}/previous-version-id"
          pnpm exec wrangler versions view "${previous_version_id}" \
            --config wrangler.jsonc \
            --json > "${RUNNER_TEMP}/previous-version.json"
          node - <<'NODE'
          const fs = require("node:fs");
          const previous = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/previous-version.json`, "utf8"),
          );
          if (previous.resources?.bindings?.some((binding) => binding.type === "secret_text")) {
            throw new Error("current asset-only version unexpectedly contains secrets");
          }
          NODE

      - name: Recheck default branch before mutation
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" \
            --jq '.sha')"
          test "${current_main}" = "${WORKFLOW_SHA}"

      - name: Restore exact Worker version
        working-directory: apps/website
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_MESSAGE: ${{ steps.request.outputs.rollback_message }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
        run: |
          set -euo pipefail
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is malformed."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          pnpm exec wrangler rollback "${TARGET_VERSION_ID}" \
            --config wrangler.jsonc \
            --message "${ROLLBACK_MESSAGE}" \
            --yes

      - name: Verify active version with read-only token
        id: after
        working-directory: apps/website
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
        run: |
          set -euo pipefail
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is malformed."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_READ_API_TOKEN is not configured."
            exit 1
          fi
          pnpm exec wrangler deployments status \
            --config wrangler.jsonc \
            --json > "${RUNNER_TEMP}/deployment-after.json"
          curl --fail --silent --show-error \
            --connect-timeout 5 \
            --max-time 20 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?service=chaft-website" \
            --output "${RUNNER_TEMP}/domains-after-response.json"
          node - <<'NODE'
          const fs = require("node:fs");
          const deployment = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/deployment-after.json`, "utf8"),
          );
          const active = deployment.versions?.filter(
            (version) => version.percentage === 100,
          );
          if (
            typeof deployment.id !== "string" ||
            !/^[a-f0-9-]{32,64}$/i.test(deployment.id) ||
            active?.length !== 1 ||
            active[0].version_id !== process.env.TARGET_VERSION_ID
          ) {
            throw new Error("requested rollback version is not serving 100 percent of traffic");
          }
          const payload = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/domains-after-response.json`, "utf8"),
          );
          if (payload.success !== true || !Array.isArray(payload.result)) {
            throw new Error("Cloudflare Custom Domain query failed after rollback");
          }
          const domains = payload.result
            .filter((domain) => domain.service === "chaft-website")
            .map(({ hostname, service, zone_name: zoneName }) => ({ hostname, service, zoneName }))
            .sort((left, right) => left.hostname.localeCompare(right.hostname));
          const before = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/domains-before.json`, "utf8"),
          );
          if (JSON.stringify(domains) !== JSON.stringify(before)) {
            throw new Error("Custom Domains changed during rollback");
          }
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/domains-after.json`,
            `${JSON.stringify(domains, null, 2)}\n`,
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment_id=${deployment.id}\n`);
          NODE

      - name: Verify the complete public deployment contract
        working-directory: apps/website
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_source_commit }}
          SITE_URL: ${{ vars.WEBSITE_SITE_URL }}
        run: |
          set -euo pipefail
          node scripts/verify-public-deployment.mjs \
            --site-url "${SITE_URL}" \
            --alternate-site-url "https://www.chaft.ai" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${EXPECTED_COMMIT}" \
            --attempts 12 \
            --delay-ms 5000 \
            --output "${RUNNER_TEMP}/public-verification.json"

      - name: Create durable rollback record
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CURRENT_DEPLOYMENT_ID: ${{ steps.after.outputs.deployment_id }}
          FAILED_VERSION_ID: ${{ inputs.failed_version_id }}
          GOVERNANCE_COMMIT: ${{ vars.CHAFT_INFRA_COMMIT }}
          INCIDENT_ID: ${{ inputs.incident_id }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.inspect.outputs.previous_deployment_id }}
          REASON: ${{ inputs.reason }}
          SITE_URL: ${{ vars.WEBSITE_SITE_URL }}
          SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          TARGET_EVIDENCE_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          TARGET_EVIDENCE_ID: ${{ steps.evidence.outputs.artifact_id }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rollback-evidence"
          node - <<'NODE'
          const fs = require("node:fs");
          const readJson = (name) =>
            JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}`, "utf8"));
          const record = {
            schemaVersion: 1,
            artifactKind: "chaft-website-rollback-record",
            result: "passed",
            recordedAt: new Date().toISOString(),
            actor: process.env.GITHUB_ACTOR,
            workflowRunId: Number(process.env.GITHUB_RUN_ID),
            workflowRunUrl:
              `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}`,
            incidentId: process.env.INCIDENT_ID,
            reason: process.env.REASON,
            governance: {
              repository: "Jurshsmith/chaft-infra",
              commit: process.env.GOVERNANCE_COMMIT,
              verification: readJson("governance-verification.json"),
            },
            target: {
              sourceCommit: process.env.SOURCE_COMMIT,
              versionId: process.env.TARGET_VERSION_ID,
              retainedEvidenceArtifactId: Number(process.env.TARGET_EVIDENCE_ID),
              retainedEvidenceArtifactDigest: process.env.TARGET_EVIDENCE_DIGEST,
            },
            cloudflare: {
              accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
              worker: "chaft-website",
              siteUrl: process.env.SITE_URL,
              failedVersionId: process.env.FAILED_VERSION_ID,
              previousDeploymentId: process.env.PREVIOUS_DEPLOYMENT_ID,
              rollbackDeploymentId: process.env.CURRENT_DEPLOYMENT_ID,
              domainsBefore: readJson("domains-before.json"),
              domainsAfter: readJson("domains-after.json"),
            },
            verification: readJson("public-verification.json"),
          };
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/rollback-evidence/rollback-record.json`,
            `${JSON.stringify(record, null, 2)}\n`,
          );
          NODE

      - name: Retain rollback evidence
        id: rollback_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaft-website-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/rollback-evidence/rollback-record.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Record rollback result
        env:
          EVIDENCE_DIGEST: ${{ steps.rollback_evidence.outputs.artifact-digest }}
          EVIDENCE_ID: ${{ steps.rollback_evidence.outputs.artifact-id }}
          INCIDENT_ID: ${{ inputs.incident_id }}
          INFRA_COMMIT: ${{ vars.CHAFT_INFRA_COMMIT }}
          PREVIOUS_VERSION_ID: ${{ steps.inspect.outputs.previous_version_id }}
          REASON: ${{ inputs.reason }}
          SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
        run: |
          {
            echo "### Cloudflare website rollback"
            echo
            echo "- Previous version: \`${PREVIOUS_VERSION_ID}\`"
            echo "- Restored version: \`${TARGET_VERSION_ID}\`"
            echo "- Source commit: \`${SOURCE_COMMIT}\`"
            echo "- Infrastructure decision: \`${INFRA_COMMIT}\`"
            echo "- Incident: \`${INCIDENT_ID}\`"
            echo "- Reason: ${REASON}"
            echo "- Evidence artifact: \`${EVIDENCE_ID}\` (\`${EVIDENCE_DIGEST}\`)"
          } >> "${GITHUB_STEP_SUMMARY}"
