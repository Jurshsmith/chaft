[workspace]
resolver = "3"
members = [
    "application/view-model",
    "apps/chaft-cli",
    "apps/chaft-node",
    "benchmarks",
    "bindings/ffi",
    "domain/core",
    "domain/types",
    "network/direct",
    "network/iroh",
    "network/sync",
    "network/transport",
    "network/wire",
    "runtime",
    "security/crypto",
    "security/identity",
    "security/mls",
    "storage/media",
    "storage/search",
    "storage/store",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Jurshsmith/chaft"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
aes-gcm-siv = "0.11"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
jsonschema = { version = "0.49", default-features = false }
libc = "0.2"
prost = "0.14"
rand_core = "0.10"
rpassword = "7"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
zip = { version = "8.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
